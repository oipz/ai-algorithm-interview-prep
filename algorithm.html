]) && (j - i < 2 || isPal[i+1][j-1]);\n        vector<vector<string>> ans;\n        vector<string> path;\n        dfs(s, 0, isPal, path, ans);\n        return ans;\n    }\nprivate:\n    void dfs(const string& s, int start, vector<vector<char>>& isPal, vector<string>& path, vector<vector<string>>& ans) {\n        if (start == (int)s.size()) { ans.push_back(path); return; }\n        for (int i = start; i < (int)s.size(); ++i) {\n            if (!isPal[start][i]) continue;\n            path.push_back(s.substr(start, i - start + 1));\n            dfs(s, i + 1, isPal, path, ans);\n            path.pop_back();\n        }\n    }\n};\n","codeLang":"cpp","codeSource":"AI 生成","hints":["留意要在『切分位置』上做选择，且每段必须是回文。","考虑回溯枚举切点，配合一个判断回文的手段。","从 start 枚举切点 i，若 s[start..i] 是回文则递归切 i+1，start 到末尾时收集一组分割；可预处理 DP 回文表加速判断。"]},{"id":"bt-6","category":"回溯","title":"复原 IP 地址","source":"LeetCode 93","difficulty":"中等","tags":["回溯","字符串"],"statement":"给定一个只含数字的字符串 s，返回所有可能的有效 IP 地址，这些地址通过在 s 中插入 '.' 来还原。返回格式有效的 IP 地址，每段不能有前导零，且每段数值在 0..255 之间。\n\n示例 1：\n输入：s = \"25525511135\"\n输出：[\"255.255.11.135\",\"255.255.111.35\"]\n\n示例 2：\n输入：s = \"0000\"\n输出：[\"0.0.0.0\"]\n\n约束：1 <= s.length <= 20，s 仅含数字。","analysis":"思路：回溯枚举每一段长度（1..3），维护已切段数 seg 和当前起点 start。当 seg==4 且 start==n 时拼成完整 IP 收集。\n\n关键点：\n1. 合法段校验：长度 >1 且首字符为 '0' 非法（前导零）；数值 >255 非法。\n2. 剪枝：剩余字符数必须满足 4-seg <= 剩余 <= 3*(4-seg)，否则提前返回。\n3. 段长超 3 或越过串尾时停止枚举。\n\n时间复杂度：O(3^4) 段长组合数常数级，每方案拼接 O(n)。\n空间复杂度：O(4) 递归栈加 path。","code":"#include <bits/stdc++.h>\nusing namespace std;\n\nclass Solution {\npublic:\n    vector<string> restoreIpAddresses(string s) {\n        vector<string> ans;\n        vector<string> path;\n        dfs(s, 0, 0, path, ans);\n        return ans;\n    }\nprivate:\n    bool valid(const string& seg) {\n        if (seg.empty() || seg.size() > 3) return false;\n        if (seg.size() > 1 && seg[0] == '0') return false;\n        return stoi(seg) <= 255;\n    }\n    void dfs(const string& s, int start, int seg, vector<string>& path, vector<string>& ans) {\n        int n = s.size();\n        if (seg == 4) {\n            if (start == n) {\n                string ip = path[0] + \".\" + path[1] + \".\" + path[2] + \".\" + path[3];\n                ans.push_back(ip);\n            }\n            return;\n        }\n        int remain = n - start;\n        if (remain < 4 - seg || remain > 3 * (4 - seg)) return;\n        for (int len = 1; len <= 3 && start + len <= n; ++len) {\n            string sub = s.substr(start, len);\n            if (!valid(sub)) continue;\n            path.push_back(sub);\n            dfs(s, start + len, seg + 1, path, ans);\n            path.pop_back();\n        }\n    }\n};\n","codeLang":"cpp","codeSource":"AI 生成","hints":["留意每段长度只能是 1..3，且有前导零和数值范围约束。","考虑回溯枚举每段长度，维护已切段数。","枚举段长 1..3，校验无前导零且数值 ≤255，seg==4 且 start==n 时拼接成完整 IP 收集；用剩余字符数剪枝。"]},{"id":"bt-7","category":"回溯","title":"单词搜索","source":"LeetCode 79","difficulty":"中等","tags":["回溯","矩阵","DFS"],"statement":"给定一个 m x n 的字符矩阵 board 和一个字符串 word，判断 word 是否出现在网格中。单词需按字母顺序通过相邻（上下左右）单元格的字母构成，同一单元格的字母不能重复使用。\n\n示例 1：\n输入：board = [[\"A\",\"B\",\"C\",\"E\"],[\"S\",\"F\",\"C\",\"S\"],[\"A\",\"D\",\"E\",\"E\"]], word = \"ABCCED\"\n输出：true\n\n约束：1 <= m, n <= 6，1 <= word.length <= 15。","analysis":"思路：对每个与 word[0] 匹配的起点做 DFS 回溯，逐字符匹配，用临时标记（置为特殊字符或 visited 数组）防止单元格复用。\n\n关键点：\n1. 原地标记：将 board[i][j] 临时改为 '#' 等非字母字符，省去 visited 矩阵，回溯后还原。\n2. 剪枝：先统计 board 各字符频次，若 word 某字符不够则直接 false。\n3. 越界、字符不匹配、已访问任一条件不满足即返回。\n\n时间复杂度：O(m * n * 3^L)，L 为 word 长度。\n空间复杂度：O(L) 递归栈。","code":"#include <bits/stdc++.h>\nusing namespace std;\n\nclass Solution {\npublic:\n    bool exist(vector<vector<char>>& board, string word) {\n        int m = board.size(), n = board[0].size();\n        for (int i = 0; i < m; ++i)\n            for (int j = 0; j < n; ++j)\n                if (dfs(board, word, i, j, 0)) return true;\n        return false;\n    }\nprivate:\n    bool dfs(vector<vector<char>>& board, const string& word, int i, int j, int k) {\n        int m = board.size(), n = board[0].size();\n        if (i < 0 || i >= m || j < 0 || j >= n || board[i][j] != word[k]) return false;\n        if (k == (int)word.size() - 1) return true;\n        char tmp = board[i][j];\n        board[i][j] = '#';\n        bool ok = dfs(board, word, i + 1, j, k + 1)\n                 || dfs(board, word, i - 1, j, k + 1)\n                 || dfs(board, word, i, j + 1, k + 1)\n                 || dfs(board, word, i, j - 1, k + 1);\n        board[i][j] = tmp;\n        return ok;\n    }\n};\n","codeLang":"cpp","codeSource":"AI 生成","hints":["留意『相邻单元格』和『不能重复使用同一格』这两个约束。","考虑从匹配首字符的起点做 DFS 回溯，逐字符比对。","对每个匹配 word[0] 的起点 DFS，匹配时把该格临时改成特殊字符防复用，回溯后还原；越界或不匹配即返回。"]},{"id":"bt-8","category":"回溯","title":"N 皇后","source":"LeetCode 51","difficulty":"困难","tags":["回溯","位运算","矩阵"],"statement":"按照国际象棋规则将 n 个皇后放置在 n x n 的棋盘上，使得皇后彼此之间不能相互攻击（任意两个皇后不在同一行、同一列、同一对角线）。返回所有不同的解法。每个解法是表示棋盘的字符串数组，'Q' 表示皇后，'.' 表示空位。\n\n示例 1：输入 n = 4\n输出：[[\".Q..\",\"...Q\",\"Q...\",\"..Q.\"],[\"..Q.\",\"Q...\",\"...Q\",\".Q..\"]]\n\n约束：1 <= n <= 9。","analysis":"思路：逐行回溯，每行选一个列放皇后。用三个集合/位掩码记录已占列、主对角线（row-col 恒定）、副对角线（row+col 恒定）。\n\n关键点：\n1. 一行一皇后，天然消除同行冲突，只需查列与两条对角线。\n2. 位运算版本用整数 cols、diag1、diag2 的位表示占用，加速常数。\n3. 找到完整布局后把列选数组转成字符串棋盘收集。\n\n时间复杂度：O(n!) 级别。\n空间复杂度：O(n) 递归栈加标记。","code":"#include <bits/stdc++.h>\nusing namespace std;\n\nclass Solution {\npublic:\n    vector<vector<string>> solveNQueens(int n) {\n        vector<vector<string>> ans;\n        vector<int> queens(n, -1);\n        vector<char> col(n, 0), diag1(2*n, 0), diag2(2*n, 0);\n        dfs(n, 0, queens, col, diag1, diag2, ans);\n        return ans;\n    }\nprivate:\n    void dfs(int n, int row, vector<int>& queens, vector<char>& col, vector<char>& diag1, vector<char>& diag2, vector<vector<string>>& ans) {\n        if (row == n) {\n            vector<string> board(n, string(n, '.'));\n            for (int r = 0; r < n; ++r) board[r][queens[r]] = 'Q';\n            ans.push_back(board);\n            return;\n        }\n        for (int c = 0; c < n; ++c) {\n            if (col[c] || diag1[row - c + n] || diag2[row + c]) continue;\n            queens[row] = c;\n            col[c] = diag1[row - c + n] = diag2[row + c] = 1;\n            dfs(n, row + 1, queens, col, diag1, diag2, ans);\n            col[c] = diag1[row - c + n] = diag2[row + c] = 0;\n            queens[row] = -1;\n        }\n    }\n};\n","codeLang":"cpp","codeSource":"AI 生成","hints":["留意皇后间不能同行、同列、同对角线。","考虑逐行回溯，每行选一个列放置。","逐行放皇后，用集合或位掩码记录已占列、主对角线(row-col)、副对角线(row+col)，三约束不冲突才递归，放满 n 行收集棋盘。"]},{"id":"bt-9","category":"回溯","title":"解数独","source":"LeetCode 37","difficulty":"困难","tags":["回溯","位运算","矩阵"],"statement":"编写一个程序，通过填充空格来解数独。空格用 '.' 表示。解需满足：每行、每列、每个 3x3 宫内数字 1-9 各出现一次。保证输入有唯一解。\n\n约束：board 是 9x9，元素为数字或 '.'。","analysis":"思路：经典回溯填数。预处理每行、每列、每宫的已用数字集合，扫描空格逐一尝试 1..9 中合法的数字并递归，失败则撤销。可用位运算用 9 位整数表示集合加速。\n\n关键点：\n1. 优化：每次优先选择候选最少的空格（MRV 启发式），大幅减少分支。\n2. 三约束集合：rows[i]、cols[j]、boxes[i/3*3+j/3]，三者 AND 后取补得候选。\n3. 用返回 bool 传递递归成功信号，找到解即整体返回。\n\n时间复杂度：最坏指数级，实际受约束剪枝大幅压缩。\n空间复杂度：O(81) 递归深度上限加标记。","code":"#include <bits/stdc++.h>\nusing namespace std;\n\nclass Solution {\npublic:\n    void solveSudoku(vector<vector<char>>& board) {\n        int rows[9] = {0}, cols[9] = {0}, boxes[9] = {0};\n        for (int i = 0; i < 9; ++i)\n            for (int j = 0; j < 9; ++j)\n                if (board[i][j] != '.') {\n                    int b = 1 << (board[i][j] - '1');\n                    rows[i] |= b; cols[j] |= b; boxes[(i/3)*3 + j/3] |= b;\n                }\n        dfs(board, rows, cols, boxes);\n    }\nprivate:\n    bool dfs(vector<vector<char>>& board, int* rows, int* cols, int* boxes) {\n        for (int i = 0; i < 9; ++i)\n            for (int j = 0; j < 9; ++j)\n                if (board[i][j] == '.') {\n                    int mask = ~(rows[i] | cols[j] | boxes[(i/3)*3 + j/3]) & 0x1FF;\n                    while (mask) {\n                        int d = __builtin_ctz(mask);\n                        int b = 1 << d;\n                        board[i][j] = '1' + d;\n                        rows[i] |= b; cols[j] |= b; boxes[(i/3)*3 + j/3] |= b;\n                        if (dfs(board, rows, cols, boxes)) return true;\n                        rows[i] &= ~b; cols[j] &= ~b; boxes[(i/3)*3 + j/3] &= ~b;\n                        board[i][j] = '.';\n                        mask &= mask - 1;\n                    }\n                    return false;\n                }\n        return true;\n    }\n};\n","codeLang":"cpp","codeSource":"AI 生成","hints":["留意每行、每列、每个 3x3 宫的数字都不能重复。","考虑回溯逐个空格尝试 1..9 中合法的数字。","维护行、列、宫三个已用集合，对空格尝试合法数字并递归，失败则撤销；可优先选候选最少的空格(MRV)减少分支。"]},{"id":"gd-1","category":"贪心","title":"分发饼干","source":"LeetCode 455","difficulty":"简单","tags":["数组","贪心"],"statement":"假设你是一位很棒的家长，想要给你的孩子们一些小饼干。每个孩子最多只能给一块饼干。\n每个孩子 i 都有一个胃口值 g[i]，这是能让孩子满足的饼干的最小尺寸；每块饼干 j 有一个尺寸 s[j]。若 s[j] >= g[i]，则可以将饼干 j 分配给孩子 i，这个孩子会满足。你的目标是尽可能多地满足孩子，输出能满足的最大孩子数。\n\n示例：g = [1,2,3], s = [1,1] 输出 1；g = [1,2], s = [1,2,3] 输出 2。","analysis":"贪心思路：将孩子胃口和饼干尺寸都从小到大排序，用尽量小的饼干去满足胃口最小的孩子。\n\n关键点：双指针扫描，i 指向孩子，j 指向饼干。若当前饼干能满足当前孩子则 i++，无论如何 j++。这样每个饼干要么给当前孩子，要么太小直接跳过，保证不浪费。\n\n时间复杂度 O(n log n + m log m)，主要来自排序。空间复杂度 O(log n)（排序栈）。","code":"class Solution {\npublic:\n    int findContentChildren(vector<int>& g, vector<int>& s) {\n        sort(g.begin(), g.end());\n        sort(s.begin(), s.end());\n        int i = 0, j = 0;\n        while (i < (int)g.size() && j < (int)s.size()) {\n            if (s[j] >= g[i]) i++;\n            j++;\n        }\n        return i;\n    }\n};","codeLang":"cpp","codeSource":"AI 生成","hints":["留意『尽量小饼干满足胃口最小孩子』这一直觉。","考虑排序后用双指针贪心匹配。","把 g 和 s 都升序排序，双指针扫描：当前饼干能满足当前孩子就 i++，无论如何 j++，最后 i 即答案。"]},{"id":"gd-2","category":"贪心","title":"最大子序和","source":"LeetCode 53","difficulty":"中等","tags":["数组","贪心"],"statement":"给你一个整数数组 nums，找到一个具有最大和的连续子数组（子数组最少包含一个元素），返回其最大和。\n\n示例：nums = [-2,1,-3,4,-1,2,1,-5,4] 输出 6（子数组 [4,-1,2,1]）。\n\n进阶：要求 O(n) 时间、O(1) 空间的解法。","analysis":"贪心（Kadane 算法）思路：维护当前子段和 cur，若 cur + x < x 说明前面的累和是负担，直接从 x 重新开始；否则累加。每步用 cur 更新答案。\n\n关键点：cur = max(x, cur + x)，意思是「要么从当前元素重新开始，要么把当前元素接到前面」。ans 始终记录历史最大值。\n\n时间复杂度 O(n)，空间复杂度 O(1)。","code":"class Solution {\npublic:\n    int maxSubArray(vector<int>& nums) {\n        int ans = nums[0], cur = 0;\n        for (int x : nums) {\n            cur = max(x, cur + x);\n            ans = max(ans, cur);\n        }\n        return ans;\n    }\n};","codeLang":"cpp","codeSource":"AI 生成","hints":["留意『连续子数组』，前面累和什么时候变成负担？","考虑贪心维护当前子段和，每步决定是否重新开始。","cur = max(x, cur + x)：前面累和是负担就从当前元素重开，否则累加；ans 始终记录历史最大 cur。"]},{"id":"gd-3","category":"贪心","title":"买卖股票的最佳时机 II","source":"LeetCode 122","difficulty":"中等","tags":["数组","贪心"],"statement":"给定一个数组 prices，第 i 个元素是股票第 i 天的价格。你可以尽可能多地完成交易（多次买入卖出），但同一时刻只能持有一股。返回能获得的最大利润。\n\n示例：prices = [7,1,5,3,6,4] 输出 7（第2天买入第3天卖出得4，第4天买入第5天卖出得3，共7）。","analysis":"贪心思路：只要今天的价格比昨天高，就把这两天的差价收入囊中。因为连续上涨段等价于每天累加差价之和，多次小交易等价于一次大交易，所以贪心地累加所有正向差分即得最大利润。\n\n关键点：prices[i] - prices[i-1] > 0 就加到利润里。\n\n时间复杂度 O(n)，空间复杂度 O(1)。","code":"class Solution {\npublic:\n    int maxProfit(vector<int>& prices) {\n        int profit = 0;\n        for (int i = 1; i < (int)prices.size(); i++)\n            if (prices[i] > prices[i - 1])\n                profit += prices[i] - prices[i - 1];\n        return profit;\n    }\n};","codeLang":"cpp","codeSource":"AI 生成","hints":["留意『只要今天比昨天贵就有利润可拿』。","考虑累加所有正向差分。","若 prices[i]-prices[i-1]>0 就把差值加到利润里，连续上涨段等价于一次大交易，故贪心累加正向差分即最大利润。"]},{"id":"gd-4","category":"贪心","title":"跳跃游戏","source":"LeetCode 55","difficulty":"中等","tags":["数组","贪心"],"statement":"给定非负整数数组 nums，最初位于第一个位置。每个元素表示在该位置能跳跃的最大长度。判断是否能到达最后一个位置。\n\n示例：nums = [2,3,1,1,4] 输出 true；nums = [3,2,1,0,4] 输出 false。","analysis":"贪心思路：维护当前能到达的最远位置 mx。从左到右遍历，若 i > mx 说明当前位置不可达，返回 false；否则更新 mx = max(mx, i + nums[i])。若某一步 mx >= n-1 则可达。\n\n关键点：只要每一步都在当前覆盖范围内，就不断扩展最远覆盖。一旦遇到无法覆盖的位置即失败。\n\n时间复杂度 O(n)，空间复杂度 O(1)。","code":"class Solution {\npublic:\n    bool canJump(vector<int>& nums) {\n        int mx = 0, n = nums.size();\n        for (int i = 0; i < n; i++) {\n            if (i > mx) return false;\n            mx = max(mx, i + nums[i]);\n            if (mx >= n - 1) return true;\n        }\n        return true;\n    }\n};","codeLang":"cpp","codeSource":"AI 生成","hints":["留意『能否到达』只取决于最远覆盖范围。","考虑贪心维护当前能到的最远位置。","维护 mx，遍历时若 i>mx 则不可达返回 false，否则更新 mx=max(mx, i+nums[i])，mx≥n-1 即可达。"]},{"id":"gd-5","category":"贪心","title":"跳跃游戏 II","source":"LeetCode 45","difficulty":"中等","tags":["数组","贪心"],"statement":"给定非负整数数组 nums，最初位于第一个位置，每个元素表示该位置能跳跃的最大长度。假设你总能到达最后一个位置，求到达最后位置的最少跳跃次数。\n\n示例：nums = [2,3,1,1,4] 输出 2（跳到索引1，再跳到末尾）。","analysis":"贪心（BFS 层次/区间跳跃）思路：维护当前一跳能到达的边界 end 和下一跳能到达的最远 mx。遍历时不断更新 mx，当 i 到达 end 时必须再跳一次，把 end 更新为 mx。注意只遍历到倒数第二个位置。\n\n关键点：i == end 时 ans++ 且 end = mx，相当于贪心地用当前一跳覆盖尽量远，到达边界再结算下一跳。\n\n时间复杂度 O(n)，空间复杂度 O(1)。","code":"class Solution {\npublic:\n    int jump(vector<int>& nums) {\n        int ans = 0, mx = 0, end = 0, n = nums.size();\n        for (int i = 0; i + 1 < n; i++) {\n            mx = max(mx, i + nums[i]);\n            if (i == end) {\n                ans++;\n                end = mx;\n            }\n        }\n        return ans;\n    }\n};","codeLang":"cpp","codeSource":"AI 生成","hints":["留意要的是『最少跳跃次数』，一次跳到边界还是最远？","考虑用当前一跳的边界和下一跳最远位置贪心结算。","维护 end（当前一跳边界）和 mx（下一跳最远），遍历到 i==end 时 ans++ 并把 end 更新为 mx，只遍历到倒数第二个位置。"]},{"id":"gd-6","category":"贪心","title":"K 次取反后最大化的数组和","source":"LeetCode 1005","difficulty":"简单","tags":["数组","贪心"],"statement":"给定整数数组 nums 和整数 k，你可以选择数组中任意元素改变其符号，共操作 k 次。返回 k 次操作后数组和的最大值。\n\n示例：nums = [4,2,3], k = 1 输出 5；nums = [3,-1,0,2], k = 3 输出 6；nums = [2,-3,-1,5,-4], k = 2 输出 13。","analysis":"贪心思路分两步：第一步把绝对值最小的负数优先取反（负数越小取反收益越大），所以先排序，从小到大把负数翻成正数，直到用完 k 或没有负数。第二步若 k 还有剩余且为奇数，则把此时最小的元素翻一次（翻最小元素损失最小）；若 k 为偶数则可抵消无需翻。\n\n关键点：剩余 k 为奇数时只需翻一个最小元素，偶数则抵消。第二次排序找全局最小元素。\n\n时间复杂度 O(n log n)，空间复杂度 O(log n)。","code":"class Solution {\npublic:\n    int largestSumAfterKNegations(vector<int>& nums, int k) {\n        sort(nums.begin(), nums.end());\n        int n = nums.size();\n        for (int i = 0; i < n && k > 0; i++) {\n            if (nums[i] < 0) {\n                nums[i] = -nums[i];\n                k--;\n            }\n        }\n        sort(nums.begin(), nums.end());\n        if (k & 1) nums[0] = -nums[0];\n        int sum = 0;\n        for (int x : nums) sum += x;\n        return sum;\n    }\n};","codeLang":"cpp","codeSource":"AI 生成","hints":["留意『优先翻绝对值最小的负数』收益最大。","考虑分两步贪心：先翻负数，再处理剩余 k。","先排序把负数从小到大翻正直到用完 k；剩余 k 为奇数则再翻一次全局最小元素，偶数则抵消无需翻。"]},{"id":"gd-7","category":"贪心","title":"加油站","source":"LeetCode 134","difficulty":"中等","tags":["数组","贪心"],"statement":"在一条环形路线上有 n 个加油站，第 i 个加油站有汽油 gas[i] 升。从第 i 个站开往第 (i+1)%n 个站耗油 cost[i] 升。你的油箱无限大，初始为空。若能绕环路行驶一周，返回出发站编号；若不能，返回 -1。若有解则答案唯一。\n\n示例：gas = [1,2,3,4,5], cost = [3,4,5,1,2] 输出 3。","analysis":"贪心思路：维护 total 记录全程净油量，tank 记录从当前起点出发的累计油量。从左到右累加 gas[i]-cost[i] 到 tank；若 tank < 0 说明当前起点 start..i 之间任何站作为起点都会在 i 处断油，所以把起点设为 i+1 并清零 tank。最终若 total >= 0 则 start 即为答案，否则 -1。\n\n关键点：一旦某段累计为负，该段任意起点都不可行，直接跳到下一段；全局总量非负保证有解。\n\n时间复杂度 O(n)，空间复杂度 O(1)。","code":"class Solution {\npublic:\n    int canCompleteCircuit(vector<int>& gas, vector<int>& cost) {\n        int total = 0, tank = 0, start = 0;\n        for (int i = 0; i < (int)gas.size(); i++) {\n            int d = gas[i] - cost[i];\n            tank += d;\n            total += d;\n            if (tank < 0) {\n                start = i + 1;\n                tank = 0;\n            }\n        }\n        return total >= 0 ? start : -1;\n    }\n};","codeLang":"cpp","codeSource":"AI 生成","hints":["留意『一旦某段累计为负，这段任意起点都不可行』。","考虑维护 tank 和全程 total，断油就跳到下一段。","累加 gas[i]-cost[i] 到 tank，tank<0 则起点设为 i+1 并清零；最终 total≥0 则 start 为答案，否则 -1。"]},{"id":"gd-8","category":"贪心","title":"根据身高重建队列","source":"LeetCode 406","difficulty":"中等","tags":["数组","贪心"],"statement":"有 numPeople 个人打乱排队，每个人有属性 [h, k]，h 为身高，k 为该人前面身高大于等于 h 的人数。请按真实顺序重建队列并返回。\n\n示例：people = [[7,0],[4,4],[7,1],[5,0],[6,1],[5,2]] 输出 [[5,0],[7,0],[5,2],[6,1],[4,4],[7,1]]。","analysis":"贪心思路：先按身高降序排序（身高相同则 k 升序），然后依次把每个人插入到结果数组的第 k 个位置。因为先插入的都是高个子，后面插入的矮子不会影响前面高个子对 k 的计数，所以直接按下标 k 插入即可保证正确。\n\n关键点：排序比较 a[0]>b[0]（身高降序），a[0]==b[0] 时 a[1]<b[1]（k 升序）。用 vector::insert 在 k 位置插入。\n\n时间复杂度 O(n^2)（vector 插入为 O(n)），空间复杂度 O(n)。","code":"class Solution {\npublic:\n    vector<vector<int>> reconstructQueue(vector<vector<int>>& people) {\n        sort(people.begin(), people.end(), [](const auto& a, const auto& b) {\n            return a[0] == b[0] ? a[1] < b[1] : a[0] > b[0];\n        });\n        vector<vector<int>> res;\n        for (const auto& p : people)\n            res.insert(res.begin() + p[1], p);\n        return res;\n    }\n};","codeLang":"cpp","codeSource":"AI 生成","hints":["留意『前面身高≥自己的人数 k』，先放谁不影响后面的计数？","考虑先按身高降序排序，再依次插入。","按身高降序、同身高 k 升序排序，然后依次把每个人插到结果数组的第 k 个位置，先插高个子保证矮子不影响其 k 计数。"]},{"id":"gd-9","category":"贪心","title":"用最少数量的箭引爆气球","source":"LeetCode 452","difficulty":"中等","tags":["数组","贪心","区间调度"],"statement":"在二维 x 轴上排列若干气球，区间 [xstart, xend] 表示气球水平跨度。一支弓箭垂直射出（给定一个 x 坐标）可以引爆所有包含该点的气球。求引爆所有气球的最少弓箭数。\n\n示例：points = [[10,16],[2,8],[1,6],[7,12]] 输出 2。","analysis":"贪心区间调度思路（类似会议安排）：将所有区间按右端点升序排序，贪心地在当前最小右端点射箭，这样能覆盖所有左端点 <= 该右端点的气球；一旦遇到左端点 > 当前射击点，需要再射一支箭并更新射击点为新区间右端点。\n\n关键点：按右端点排序而非左端点，保证一支箭尽量靠右以覆盖最多气球。\n\n时间复杂度 O(n log n)，空间复杂度 O(log n)。","code":"class Solution {\npublic:\n    int findMinArrowShots(vector<vector<int>>& points) {\n        if (points.empty()) return 0;\n        sort(points.begin(), points.end(), [](const auto& a, const auto& b) {\n            return a[1] < b[1];\n        });\n        int arrows = 1, end = points[0][1];\n        for (int i = 1; i < (int)points.size(); i++) {\n            if (points[i][0] > end) {\n                arrows++;\n                end = points[i][1];\n            }\n        }\n        return arrows;\n    }\n};","codeLang":"cpp","codeSource":"AI 生成","hints":["留意『一支箭尽量覆盖最多气球』，射在哪个位置最优？","考虑区间调度：按某个端点排序后贪心射箭。","按右端点升序排序，在当前最小右端点射箭，覆盖所有左端点≤该点的气球；遇到左端点>射击点则再射一支并更新射击点为新区间右端点。"]},{"id":"gd-10","category":"贪心","title":"摆动序列","source":"LeetCode 376","difficulty":"中等","tags":["数组","贪心"],"statement":"如果一个数字序列相邻元素的差正负交替，则称为摆动序列。给定一个整数数组 nums，返回 nums 的最长摆动子序列的长度（子序列可通过删除若干元素得到，原序列单个元素视为长度1）。\n\n示例：nums = [1,7,4,9,2,5] 输出 6；nums = [1,17,5,10,13,15,10,5,16,8] 输出 7。","analysis":"贪心思路（等价于统计波峰波谷数）：维护 up（以上升结尾的摆动序列长度）和 down（以下降结尾的摆动序列长度）。遍历相邻差：若 nums[i] > nums[i-1] 则 up = down + 1（把当前上升接在以下降结尾的序列后）；若 nums[i] < nums[i-1] 则 down = up + 1。相等时跳过。最终取 max(up, down)。\n\n关键点：连续上升或下降段只取转折点，所以每次只更新对应的 up 或 down，不会被连续单调段干扰。\n\n时间复杂度 O(n)，空间复杂度 O(1)。","code":"class Solution {\npublic:\n    int wiggleMaxLength(vector<int>& nums) {\n        int n = nums.size();\n        if (n < 2) return n;\n        int up = 1, down = 1;\n        for (int i = 1; i < n; i++) {\n            if (nums[i] > nums[i - 1]) up = down + 1;\n            else if (nums[i] < nums[i - 1]) down = up + 1;\n        }\n        return max(up, down);\n    }\n};","codeLang":"cpp","codeSource":"AI 生成","hints":["留意『相邻差正负交替』，连续上升或下降段只关心什么？","考虑统计波峰波谷数，维护上升/下降结尾的长度。","维护 up 和 down，nums[i]>nums[i-1] 则 up=down+1，<则 down=up+1，相等跳过，最后取 max(up,down)，连续单调段只取转折点。"]},{"id":"dp-01","category":"动态规划","title":"爬楼梯","source":"LeetCode 70","difficulty":"简单","tags":["入门DP"],"statement":"假设你正在爬楼梯。需要 n 阶你才能到达楼顶。\n每次你可以爬 1 或 2 个台阶。你有多少种不同的方法可以爬到楼顶？\n注意：n 为正整数。\n\n示例：输入 n=3，输出 3\n解释：1+1+1, 1+2, 2+1 共三种方法。","analysis":"思路路径：到第 n 阶只能从第 n-1 阶爬 1 步或从第 n-2 阶爬 2 步到达，方法数相加。\n关键点：本质是斐波那契数列，注意初始化。\n状态转移：dp[i] = dp[i-1] + dp[i-2]，dp[1]=1, dp[2]=2。\n时间复杂度 O(n)，空间复杂度 O(1)（滚动变量）或 O(n)（数组）。","code":"class Solution {\npublic:\n    int climbStairs(int n) {\n        if (n <= 2) return n;\n        int a = 1, b = 2;\n        for (int i = 3; i <= n; ++i) {\n            int c = a + b;\n            a = b;\n            b = c;\n        }\n        return b;\n    }\n};","codeLang":"cpp","codeSource":"AI 生成","hints":["留意题目问的是『方法数』，不是最少步数。","考虑递推，想想到第 i 阶只可能从哪两阶过来。","令 dp[i]=dp[i-1]+dp[i-2]，即斐波那契，初始化 dp[1]=1,dp[2]=2。"]},{"id":"dp-02","category":"动态规划","title":"整数拆分","source":"LeetCode 343","difficulty":"中等","tags":["入门DP"],"statement":"给定一个正整数 n，将其拆分为至少两个正整数的和，使这些整数的乘积最大化。返回可以获得的最大乘积。\n\n示例：输入 n=10，输出 36\n解释：10 = 3+3+4，乘积 3*3*4=36。","analysis":"思路路径：拆分出的数尽量由 3 组成最优。对每个 i 遍历第一段拆分 j，取 j*(i-j) 与 j*dp[i-j] 的最大值。\n关键点：必须拆成至少两段，所以比较“不再拆”与“继续拆”两种。\n状态转移：dp[i] = max(dp[i], max(j, dp[j]) * (i-j))，对 j=1..i-1。\n时间复杂度 O(n^2)，空间复杂度 O(n)。\n数学优化：尽量拆成 3 的幂次，余数为 1 时退一个 3 凑 4，O(1)。","code":"class Solution {\npublic:\n    int integerBreak(int n) {\n        vector<int> dp(n + 1, 0);\n        dp[1] = 1;\n        for (int i = 2; i <= n; ++i) {\n            for (int j = 1; j < i; ++j) {\n                dp[i] = max(dp[i], max(j, dp[j]) * (i - j));\n            }\n        }\n        return dp[n];\n    }\n};","codeLang":"cpp","codeSource":"AI 生成","hints":["留意乘积最大，且必须拆成至少两段。","考虑枚举第一段 j，剩余部分可继续拆也可不拆，取较大者。","令 dp[i] 表示 i 拆分后的最大乘积，dp[i]=max(j,dp[j])*(i-j) 对 j 遍历取最大。"]},{"id":"dp-03","category":"动态规划","title":"打家劫舍","source":"LeetCode 198","difficulty":"中等","tags":["线性DP"],"statement":"你是一个专业的小偷，计划沿街偷窃。每间房内有一定现金，影响你偷窃的唯一制约因素是相邻的房屋装有相互连通的防盗系统，如果两间相邻的房屋在同一晚上被偷，系统会自动报警。\n给定一个非负整数数组表示每间房的现金，求一夜内能偷窃到的最高金额。\n\n示例：输入 [1,2,3,1]，输出 4\n解释：偷第1间和第3间，1+3=4。","analysis":"思路路径：对每间房决定偷或不偷。偷则前一间不能偷，不偷则继承前一间结果。\n关键点：相邻约束使状态仅依赖前两格。\n状态转移：dp[i] = max(dp[i-1], dp[i-2] + nums[i])。\n时间复杂度 O(n)，空间复杂度 O(1)（滚动）。","code":"class Solution {\npublic:\n    int rob(vector<int>& nums) {\n        int n = nums.size();\n        if (n == 0) return 0;\n        if (n == 1) return nums[0];\n        int prev2 = 0, prev1 = 0;\n        for (int x : nums) {\n            int cur = max(prev1, prev2 + x);\n            prev2 = prev1;\n            prev1 = cur;\n        }\n        return prev1;\n    }\n};","codeLang":"cpp","codeSource":"AI 生成","hints":["留意『相邻不能同时偷』这个约束。","考虑每间房偷或不偷，状态只依赖前两间。","令 dp[i]=max(dp[i-1], dp[i-2]+nums[i])，滚动即可。"]},{"id":"dp-04","category":"动态规划","title":"最长递增子序列","source":"LeetCode 300","difficulty":"中等","tags":["线性DP"],"statement":"给定一个无序的整数数组，找到其中最长严格递增子序列的长度。\n\n示例：输入 [10,9,2,5,3,7,101,18]，输出 4\n解释：最长递增子序列是 [2,3,7,101]，长度为 4。","analysis":"思路一 O(n^2)：dp[i] 表示以 nums[i] 结尾的 LIS 长度，dp[i] = max(dp[j]+1)，j<i 且 nums[j]<nums[i]。\n思路二 O(n log n)：维护一个 tails 数组，g[k] 表示长度为 k+1 的递增子序列的最小末尾元素，对每个数二分找位置覆盖或追加。\n关键点：贪心 + 二分保证 tails 递增。\n时间复杂度 O(n log n)，空间复杂度 O(n)。","code":"class Solution {\npublic:\n    int lengthOfLIS(vector<int>& nums) {\n        vector<int> tails;\n        for (int x : nums) {\n            auto it = lower_bound(tails.begin(), tails.end(), x);\n            if (it == tails.end()) tails.push_back(x);\n            else *it = x;\n        }\n        return tails.size();\n    }\n};","codeLang":"cpp","codeSource":"AI 生成","hints":["留意要的是『严格递增』且子序列可不连续。","考虑 dp[i] 表示以 nums[i] 结尾的 LIS 长度，由前面更小者转移。","dp[i]=max(dp[j]+1)，j<i 且 nums[j]<nums[i]；可再用二分优化到 O(n log n)。"]},{"id":"dp-05","category":"动态规划","title":"零钱兑换","source":"LeetCode 322","difficulty":"中等","tags":["完全背包"],"statement":"给定不同面额的硬币 coins 和一个总金额 amount，编写函数计算可以凑成总金额所需的最少硬币个数。如果没有任何一种硬币组合能组成该金额，返回 -1。\n每种硬币数量不限。\n\n示例：coins=[1,2,5], amount=11，输出 3\n解释：11=5+5+1。","analysis":"思路路径：完全背包求最少物品数。外层枚举金额，内层枚举硬币（或外物内额，二者等价）。\n关键点：初始化 dp[0]=0，其余 INF；转移取 min。\n状态转移：dp[i] = min(dp[i], dp[i-coin]+1)，对每个 coin，coin<=i。\n时间复杂度 O(amount * coins数)，空间复杂度 O(amount)。","code":"class Solution {\npublic:\n    int coinChange(vector<int>& coins, int amount) {\n        vector<int> dp(amount + 1, amount + 1);\n        dp[0] = 0;\n        for (int i = 1; i <= amount; ++i) {\n            for (int c : coins) {\n                if (c <= i) dp[i] = min(dp[i], dp[i - c] + 1);\n            }\n        }\n        return dp[amount] > amount ? -1 : dp[amount];\n    }\n};","codeLang":"cpp","codeSource":"AI 生成","hints":["留意求的是『最少硬币数』，硬币无限取。","考虑完全背包，外层枚举金额内层枚举硬币。","令 dp[i]=min(dp[i], dp[i-coin]+1)，dp[0]=0 其余 INF。"]},{"id":"dp-06","category":"动态规划","title":"分割等和子集","source":"LeetCode 416","difficulty":"中等","tags":["01背包"],"statement":"给定一个只包含正整数的非空数组，判断是否可以将该数组分割成两个子集，使得两个子集的元素和相等。\n\n示例：输入 [1,5,11,5]，输出 true\n解释：可分为 [1,5,5] 和 [11]，两者和均为 11。","analysis":"思路路径：问题等价于能否从数组中选若干元素使和为 sum/2。01背包判定问题。\n关键点：sum 为奇数直接 false；目标 = sum/2。用布尔滚动数组节省空间。\n状态转移：dp[j] = dp[j] || dp[j-nums[i]]，01背包需倒序枚举 j。\n时间复杂度 O(n*sum)，空间复杂度 O(sum)。","code":"class Solution {\npublic:\n    bool canPartition(vector<int>& nums) {\n        int s = 0;\n        for (int x : nums) s += x;\n        if (s & 1) return false;\n        int target = s / 2;\n        vector<char> dp(target + 1, 0);\n        dp[0] = 1;\n        for (int x : nums) {\n            for (int j = target; j >= x; --j) {\n                dp[j] |= dp[j - x];\n            }\n        }\n        return dp[target];\n    }\n};","codeLang":"cpp","codeSource":"AI 生成","hints":["留意两个子集和相等，即各自目标和为 sum/2。","考虑转化成能否选若干元素凑出目标和的判定问题。","01背包：dp[j]=dp[j]||dp[j-nums[i]]，j 倒序，sum 为奇数直接 false。"]},{"id":"dp-07","category":"动态规划","title":"零钱兑换 II","source":"LeetCode 518","difficulty":"中等","tags":["完全背包"],"statement":"给定不同面额的硬币和一个总金额，求可以凑成总金额的硬币组合数。每种硬币数量不限。\n组合数符合交换律，不同顺序视为同一组合。\n\n示例：coins=[1,2,5], amount=5，输出 4\n解释：5=5, 5=2+2+1, 5=2+1+1+1, 5=1+1+1+1+1。","analysis":"思路路径：完全背包求方案数。先枚举硬币再枚举金额，避免同组合不同顺序重复计数。\n关键点：循环顺序决定是组合数还是排列数。组合数须外物内额。\n状态转移：dp[i] += dp[i-coin]，对每个 coin，coin<=i，dp[0]=1。\n时间复杂度 O(amount * coins数)，空间复杂度 O(amount)。","code":"class Solution {\npublic:\n    int change(int amount, vector<int>& coins) {\n        vector<int> dp(amount + 1, 0);\n        dp[0] = 1;\n        for (int c : coins) {\n            for (int i = c; i <= amount; ++i) {\n                dp[i] += dp[i - c];\n            }\n        }\n        return dp[amount];\n    }\n};","codeLang":"cpp","codeSource":"AI 生成","hints":["留意求的是『组合数』，不同顺序算同一组合。","考虑循环顺序会影响组合还是排列，想想哪个先枚举。","外层枚举硬币、内层枚举金额，dp[i]+=dp[i-coin]，dp[0]=1。"]},{"id":"dp-08","category":"动态规划","title":"最长公共子序列","source":"LeetCode 1143","difficulty":"中等","tags":["线性DP"],"statement":"给定两个字符串 text1 和 text2，返回这两个字符串的最长公共子序列的长度。\n子序列是在原序列中删除若干元素（不改变剩余元素相对顺序）得到的新序列。\n\n示例：text1=\"abcde\", text2=\"ace\"，输出 3\n解释：最长公共子序列为 \"ace\"。","analysis":"思路路径：dp[i][j] 表示 text1 前 i 个与 text2 前 j 个的 LCS 长度。字符相等则延长，不等则取两侧最大。\n关键点：状态按前缀定义，转移 O(1)。\n状态转移：若 s1[i]==s2[j] 则 dp[i][j]=dp[i-1][j-1]+1；否则 dp[i][j]=max(dp[i-1][j], dp[i][j-1])。\n时间复杂度 O(mn)，空间复杂度 O(mn) 可滚动至 O(min(m,n))。","code":"class Solution {\npublic:\n    int longestCommonSubsequence(string& a, string& b) {\n        int m = a.size(), n = b.size();\n        vector<vector<int>> dp(m + 1, vector<int>(n + 1, 0));\n        for (int i = 1; i <= m; ++i)\n            for (int j = 1; j <= n; ++j)\n                if (a[i-1] == b[j-1]) dp[i][j] = dp[i-1][j-1] + 1;\n                else dp[i][j] = max(dp[i-1][j], dp[i][j-1]);\n        return dp[m][n];\n    }\n};","codeLang":"cpp","codeSource":"AI 生成","hints":["留意子序列不要求连续，只要相对顺序不变。","考虑两串按前缀定义状态，相等则延长否则取两侧最大。","令 dp[i][j]：s1 前 i 与 s2 前 j 的 LCS；相等 dp[i-1][j-1]+1，否则 max 两侧。"]},{"id":"dp-09","category":"动态规划","title":"编辑距离","source":"LeetCode 72","difficulty":"困难","tags":["线性DP"],"statement":"给定两个单词 word1 和 word2，计算将 word1 转换成 word2 所使用的最少操作数。\n可以对一个单词进行三种操作：插入一个字符、删除一个字符、替换一个字符。\n\n示例：word1=\"horse\", word2=\"ros\"，输出 3\n解释：horse->rorse->rose->ros（替换/删除/删除）。","analysis":"思路路径：dp[i][j] 表示 word1 前 i 字符转成 word2 前 j 字符的最小操作数。末位字符相等则免操作继承左上方；不等则取增删改三者最小加一。\n关键点：初始化 dp[i][0]=i（全删），dp[0][j]=j（全插）。\n状态转移：相等 dp[i][j]=dp[i-1][j-1]；不等 dp[i][j]=min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1])+1（删/增/换）。\n时间复杂度 O(mn)，空间 O(mn) 可滚动至 O(n)。","code":"class Solution {\npublic:\n    int minDistance(string& a, string& b) {\n        int m = a.size(), n = b.size();\n        vector<vector<int>> dp(m + 1, vector<int>(n + 1, 0));\n        for (int i = 0; i <= m; ++i) dp[i][0] = i;\n        for (int j = 0; j <= n; ++j) dp[0][j] = j;\n        for (int i = 1; i <= m; ++i)\n            for (int j = 1; j <= n; ++j)\n                if (a[i-1] == b[j-1]) dp[i][j] = dp[i-1][j-1];\n                else dp[i][j] = min({dp[i-1][j], dp[i][j-1], dp[i-1][j-1]}) + 1;\n        return dp[m][n];\n    }\n};","codeLang":"cpp","codeSource":"AI 生成","hints":["留意只有插入、删除、替换三种操作。","考虑按两串前缀定义状态，末位字符相等可免操作。","令 dp[i][j]：word1 前 i 转 word2 前 j 的最少操作；相等继承 dp[i-1][j-1]，否则三者取 min+1。"]},{"id":"dp-10","category":"动态规划","title":"最长回文子序列","source":"LeetCode 516","difficulty":"中等","tags":["区间DP"],"statement":"给定一个字符串 s，找到其中最长的回文子序列的长度。子序列不要求连续。\n\n示例：输入 \"bbbab\"，输出 4\n解释：最长回文子序列为 \"bbbb\"。","analysis":"思路路径：区间 DP。dp[i][j] 表示 s[i..j] 内最长回文子序列长度。两端字符相等则区间内最长回文加 2；不等则取去掉一端的最大。\n关键点：长度从小到大枚举，保证子状态已算好；区间长度 1 时 dp=1。\n状态转移：s[i]==s[j]：dp[i][j]=dp[i+1][j-1]+2；否则 dp[i][j]=max(dp[i+1][j],dp[i][j-1])。\n时间复杂度 O(n^2)，空间 O(n^2)。\n等价做法：LCS(s, reverse(s))。","code":"class Solution {\npublic:\n    int longestPalindromeSubseq(string s) {\n        int n = s.size();\n        vector<vector<int>> dp(n, vector<int>(n, 0));\n        for (int i = 0; i < n; ++i) dp[i][i] = 1;\n        for (int len = 2; len <= n; ++len) {\n            for (int i = 0; i + len - 1 < n; ++i) {\n                int j = i + len - 1;\n                if (s[i] == s[j]) dp[i][j] = dp[i+1][j-1] + 2;\n                else dp[i][j] = max(dp[i+1][j], dp[i][j-1]);\n            }\n        }\n        return dp[0][n-1];\n    }\n};","codeLang":"cpp","codeSource":"AI 生成","hints":["留意子序列不要求连续，且问的是回文长度。","考虑区间 DP，状态用两端下标 [i,j] 定义。","令 dp[i][j] 为 s[i..j] 最长回文子序列；s[i]==s[j] 则 dp[i+1][j-1]+2，否则 max(dp[i+1][j],dp[i][j-1])。"]},{"id":"dp-11","category":"动态规划","title":"打家劫舍 III","source":"LeetCode 337","difficulty":"中等","tags":["树形DP"],"statement":"在上题基础上，房屋排列在一棵二叉树上，根节点连接两间相邻子房。如果两间直接相连的房屋（父与子）在同一晚被偷，系统会报警。返回能在不触发报警情况下偷窃的最高金额。\n\n示例：root=[3,2,3,null,3,null,1]，输出 7\n解释：偷第二层两间 3+3+1=7（根 3 不偷）。","analysis":"思路路径：树形 DP，后序遍历。对每个节点返回 {偷本节点, 不偷本节点} 两种状态。偷本节点则子节点必须不偷；不偷本节点则子节点可偷可不偷。\n关键点：递归返回 pair，合并子树结果。\n状态转移：rob=node->val+left.notRob+right.notRob；notRob=max(left.rob,left.notRob)+max(right.rob,right.notRob)。\n时间复杂度 O(n)，空间 O(h) 递归栈。","code":"class Solution {\n    pair<int,int> dfs(TreeNode* node) {\n        if (!node) return {0, 0};\n        auto L = dfs(node->left);\n        auto R = dfs(node->right);\n        int rob = node->val + L.second + R.second;\n        int notRob = max(L.first, L.second) + max(R.first, R.second);\n        return {rob, notRob};\n    }\npublic:\n    int rob(TreeNode* root) {\n        auto p = dfs(root);\n        return max(p.first, p.second);\n    }\n};","codeLang":"cpp","codeSource":"AI 生成","hints":["留意房屋在二叉树上，相邻指父子关系。","考虑树形 DP，每个节点返回偷与不偷两种状态。","后序遍历：rob=val+左右 notRob；notRob=左右各自 max(rob,notRob) 之和。"]},{"id":"dp-12","category":"动态规划","title":"不同的二叉搜索树","source":"LeetCode 96","difficulty":"中等","tags":["线性DP","树形DP"],"statement":"给定一个整数 n，求以 1..n 为节点组成的二叉搜索树（BST）有多少种不同结构？\n\n示例：n=3，输出 5\n解释：5 种不同结构的 BST。","analysis":"思路路径：卡特兰数。枚举根 j，左子树由 1..j-1 构成、右子树由 j+1..n 构成，结构数与具体值无关只与个数有关，故 dp[n]=sum(dp[j-1]*dp[n-j])。\n关键点：BST 形态数只依赖节点个数，递归可去重为 DP。\n状态转移：C[n]=Σ C[i-1]*C[n-i]，C[0]=1。\n时间复杂度 O(n^2)，空间 O(n)。","code":"class Solution {\npublic:\n    int numTrees(int n) {\n        vector<int> dp(n + 1, 0);\n        dp[0] = 1;\n        for (int i = 1; i <= n; ++i)\n            for (int j = 1; j <= i; ++j)\n                dp[i] += dp[j-1] * dp[i-j];\n        return dp[n];\n    }\n};","codeLang":"cpp","codeSource":"AI 生成","hints":["留意问的是『结构数』而非具体树。","考虑枚举根 j，左右子树结构数只与节点个数有关。","卡特兰数：C[n]=Σ C[j-1]*C[n-j]，C[0]=1。"]},{"id":"dp-13","category":"动态规划","title":"优美的排列","source":"LeetCode 526","difficulty":"困难","tags":["状压DP"],"statement":"假设有 1 到 n 的 n 个整数。判断其所有排列中，满足“第 i 位的数字能被 i 整除，或 i 能被该数字整除”的排列数，称为优美的排列。返回优美排列的数量。\n\n示例：n=2，输出 2\n解释：[1,2]（1|1, 2%2=0）与 [2,1]（2%1=0, 1|1）均满足。","analysis":"思路路径：n<=15，用状压 DP。f[mask] 表示已使用集合为 mask 时的合法前缀方案数。逐位填：当前填到第 popcount(mask) 位，枚举尚未使用的数 x，若 x 与该位置满足整除关系则累加。\n关键点：用位集合表示已用数；位置由 popcount 决定避免额外维度。\n状态转移：f[mask] += f[mask ^ (1<<(x-1))]，当 x 满足位约束。\n时间复杂度 O(n * 2^n)，空间 O(2^n)。","code":"class Solution {\npublic:\n    int countArrangement(int n) {\n        vector<int> dp(1 << n, 0);\n        dp[0] = 1;\n        for (int mask = 0; mask < (1 << n); ++mask) {\n            if (!dp[mask]) continue;\n            int pos = __builtin_popcount(mask) + 1; // 当前要填第 pos 位\n            for (int x = 1; x <= n; ++x) {\n                if (mask & (1 << (x-1))) continue;\n                if (x % pos == 0 || pos % x == 0) {\n                    dp[mask | (1 << (x-1))] += dp[mask];\n                }\n            }\n        }\n        return dp[(1 << n) - 1];\n    }\n};","codeLang":"cpp","codeSource":"AI 生成","hints":["留意 n 很小（≤15），适合位运算表示集合。","考虑状压 DP，用 mask 表示已使用的数。","令 f[mask] 为已用集合 mask 的方案数，位置由 popcount 决定；f[mask]+=f[mask^(1<<(x-1))] 当 x 满足整除约束。"]},{"id":"dp-14","category":"动态规划","title":"买卖股票的最佳时机 IV","source":"LeetCode 188","difficulty":"困难","tags":["状态机DP"],"statement":"给定一个整数数组 prices 表示某支股票每天价格，你最多可以完成 k 笔交易（一买一卖为一笔，同一时刻最多持有一股）。求能获得的最大利润。\n注意：你不能同时参与多笔交易（再次买入前必须卖出）。\n\n示例：k=2, prices=[2,4,1]，输出 2\n解释：第1天买第2天卖，2->4，赚2。","analysis":"思路路径：状态机 DP。用 buy[j]/sell[j] 表示完成 j 笔交易后的“持有/未持有”最大现金。每只股票价格更新，buy 在已 sell[j-1] 基础上买入，sell 在 buy[j] 基础上卖出。\n关键点：k 大于 n/2 时退化为无限次交易（贪心累加正差）；否则三维压成二维滚动。\n状态转移：buy[j]=max(buy[j], sell[j-1]-price)；sell[j]=max(sell[j], buy[j]+price)。\n时间复杂度 O(n*k)，空间 O(k)。","code":"class Solution {\npublic:\n    int maxProfit(int k, vector<int>& prices) {\n        int n = prices.size();\n        if (n < 2 || k == 0) return 0;\n        if (k >= n / 2) {\n            int profit = 0;\n            for (int i = 1; i < n; ++i)\n                if (prices[i] > prices[i-1])\n                    profit += prices[i] - prices[i-1];\n            return profit;\n        }\n        vector<int> buy(k+1, INT_MIN/2), sell(k+1, 0);\n        for (int p : prices) {\n            for (int j = 1; j <= k; ++j) {\n                buy[j] = max(buy[j], sell[j-1] - p);\n                sell[j] = max(sell[j], buy[j] + p);\n            }\n        }\n        return sell[k];\n    }\n};","codeLang":"cpp","codeSource":"AI 生成","hints":["留意『最多 k 笔交易』且同一时刻最多持有一股。","考虑状态机 DP，按交易笔数分持有/未持有两种状态。","buy[j]=max(buy[j], sell[j-1]-price)；sell[j]=max(sell[j], buy[j]+price)；k>n/2 时退化为贪心累加正差。"]},{"id":"gr-001","category":"图论/并查集","title":"省份数量","source":"LeetCode 547","difficulty":"中等","tags":["并查集"],"statement":"有 n 个城市，其中一些彼此相连。isConnected[i][j] = 1 表示第 i 个城市和第 j 个城市直接相连，0 表示不相连。省份是直接或间接相连的城市组成的集合。求省份数量。","analysis":"使用并查集。初始化每个城市为自身根。遍历 isConnected 矩阵的上三角（j>i），若 isConnected[i][j]==1 则 union(i,j)。\n最后统计 parent[i]==i 的根的数量即为答案。\n关键点：并查集路径压缩，只需处理上三角避免重复。\n时间复杂度 O(n^2 · α(n))，空间 O(n)。","code":"class Solution {\npublic:\n    int find(vector<int>& p, int x) {\n        return p[x]==x ? x : p[x]=find(p, p[x]);\n    }\n    void unite(vector<int>& p, int a, int b) {\n        p[find(p,a)] = find(p,b);\n    }\n    int findCircleNum(vector<vector<int>>& isConnected) {\n        int n = isConnected.size();\n        vector<int> p(n);\n        iota(p.begin(), p.end(), 0);\n        for (int i=0;i<n;i++)\n            for (int j=i+1;j<n;j++)\n                if (isConnected[i][j]) unite(p,i,j);\n        int ans=0;\n        for (int i=0;i<n;i++) if (find(p,i)==i) ans++;\n        return ans;\n    }\n};","codeLang":"cpp","codeSource":"AI 生成","hints":["留意『省份』即直接或间接相连的连通集合。","考虑用一种维护集合合并与查询的数据结构。","并查集：遍历上三角 isConnected[i][j]==1 则 union(i,j)，最后统计 parent[i]==i 的个数。"]},{"id":"gr-002","category":"图论/并查集","title":"冗余连接","source":"LeetCode 684","difficulty":"中等","tags":["并查集","树"],"statement":"树有 n 个节点标号 1..n，添加一条边后形成环。给定构成该图的边数组 edges，返回可删除的边，使得剩余图为树。若有多个答案，返回原数组中最后出现的边。","analysis":"使用并查集。按 edges 顺序逐条加入，若某条边的两端 find 后属于同一集合，说明该边会成环，即为冗余边，直接返回。\n关键点：按顺序处理保证返回最后一条可删边。\n时间复杂度 O(n · α(n))，空间 O(n)。","code":"class Solution {\npublic:\n    vector<int> parent;\n    int find(int x) {\n        return parent[x]==x ? x : parent[x]=find(parent[x]);\n    }\n    vector<int> findRedundantConnection(vector<vector<int>>& edges) {\n        int n = edges.size();\n        parent.resize(n+1);\n        iota(parent.begin(), parent.end(), 0);\n        for (auto& e : edges) {\n            int a = find(e[0]), b = find(e[1]);\n            if (a==b) return e;\n            parent[a] = b;\n        }\n        return {};\n    }\n};","codeLang":"cpp","codeSource":"AI 生成","hints":["留意图原本是树，多了一条边才成环。","考虑按边顺序逐条加入，什么时候会发现成环。","并查集：加边前 find 两端已同集合则该边为冗余边，按顺序返回最后一条即可。"]},{"id":"gr-003","category":"图论/并查集","title":"等式方程的可满足性","source":"LeetCode 990","difficulty":"中等","tags":["并查集"],"statement":"给定方程数组 equations，每个形如 \"a==b\" 或 \"a!=b\"。判断是否能给变量赋值使所有方程同时成立。","analysis":"使用并查集。第一遍处理所有 \"==\" 方程，将两端 union。第二遍检查每个 \"!=\" 方程两端是否在同一集合，若在则返回 false。\n关键点：相等关系传递需先合并再检查不等。\n时间复杂度 O(n · α)，空间 O(26)。","code":"class Solution {\npublic:\n    int parent[26];\n    int find(int x) { return parent[x]==x ? x : parent[x]=find(parent[x]); }\n    bool equationsPossible(vector<string>& equations) {\n        for (int i=0;i<26;i++) parent[i]=i;\n        for (auto& e : equations)\n            if (e[1]=='=') {\n                int a=e[0]-'a', b=e[3]-'a';\n                parent[find(a)] = find(b);\n            }\n        for (auto& e : equations)\n            if (e[1]=='!') {\n                int a=e[0]-'a', b=e[3]-'a';\n                if (find(a)==find(b)) return false;\n            }\n        return true;\n    }\n};","codeLang":"cpp","codeSource":"AI 生成","hints":["留意相等关系具有传递性，不等则不能在同集合。","考虑分两遍处理：先合并相等的，再检查不等的。","并查集：先对所有 a==b 做 union，再对每个 a!=b 检查 find(a)==find(b) 则 false。"]},{"id":"gr-004","category":"图论/并查集","title":"岛屿数量","source":"LeetCode 200","difficulty":"中等","tags":["DFS","BFS","并查集"],"statement":"给定二维网格 grid，'1' 为陆地，'0' 为水。岛屿被水包围，由相邻陆地水平或垂直连接形成。求岛屿数量。","analysis":"遍历每个格子，若为 '1' 则岛屿数加一并 DFS/BFS 将整个岛屿标记为已访问（原地改为 '0'）。\n关键点：原地修改省去 visited 数组；四个方向递归。\n时间复杂度 O(m·n)，空间 O(m·n) 递归栈最坏。","code":"class Solution {\npublic:\n    int m, n;\n    void dfs(vector<vector<char>>& g, int i, int j) {\n        if (i<0||i>=m||j<0||j>=n||g[i][j]!='1') return;\n        g[i][j]='0';\n        dfs(g,i+1,j); dfs(g,i-1,j); dfs(g,i,j+1); dfs(g,i,j-1);\n    }\n    int numIslands(vector<vector<char>>& grid) {\n        m=grid.size(); n=grid[0].size();\n        int ans=0;\n        for (int i=0;i<m;i++)\n            for (int j=0;j<n;j++)\n                if (grid[i][j]=='1') { ans++; dfs(grid,i,j); }\n        return ans;\n    }\n};","codeLang":"cpp","codeSource":"AI 生成","hints":["留意『岛屿』即四连通的陆地连通块。","考虑遍历每个格子，遇到陆地就计数并扩散标记。","DFS/BFS：遇 '1' 计数加一并把整块染成 '0'（原地修改省 visited），四方向递归。"]},{"id":"gr-005","category":"图论/并查集","title":"课程表","source":"LeetCode 207","difficulty":"中等","tags":["拓扑排序","BFS","图"],"statement":"共 numCourses 门课，编号 0..numCourses-1。prerequisites[i]=[a,b] 表示要先修 b 才能修 a。判断是否能完成所有课程（即图无环）。","analysis":"拓扑排序 BFS（Kahn 算法）。建邻接表并统计入度，入队所有入度为 0 的节点，每次取出队首并对邻居入度减一，若为 0 则入队。最终若处理节点数等于 numCourses 则无环。\n关键点：入度数组 + 队列模拟。\n时间复杂度 O(V+E)，空间 O(V+E)。","code":"class Solution {\npublic:\n    bool canFinish(int numCourses, vector<vector<int>>& prerequisites) {\n        vector<vector<int>> g(numCourses);\n        vector<int> indeg(numCourses, 0);\n        for (auto& p : prerequisites) { g[p[1]].push_back(p[0]); indeg[p[0]]++; }\n        queue<int> q;\n        for (int i=0;i<numCourses;i++) if (indeg[i]==0) q.push(i);\n        int cnt=0;\n        while (!q.empty()) {\n            int u=q.front(); q.pop(); cnt++;\n            for (int v : g[u]) if (--indeg[v]==0) q.push(v);\n        }\n        return cnt==numCourses;\n    }\n};","codeLang":"cpp","codeSource":"AI 生成","hints":["留意问的是『能否完成所有课程』，即检测有向图是否有环。","考虑用入度和队列模拟的拓扑排序。","Kahn：建邻接表统计入度，入度 0 入队，出队时邻居入度减 1 归零则入队；处理数等于 numCourses 即无环。"]},{"id":"gr-006","category":"图论/并查集","title":"课程表 II","source":"LeetCode 210","difficulty":"中等","tags":["拓扑排序","BFS","图"],"statement":"同课程表，返回任意一个合法修课顺序；若不可能完成所有课程则返回空数组。","analysis":"同 Kahn 拓扑排序，出队顺序即为拓扑序。若 cnt==numCourses 返回该顺序，否则返回空数组。\n关键点：order 记录 BFS 出队顺序。\n时间复杂度 O(V+E)，空间 O(V+E)。","code":"class Solution {\npublic:\n    vector<int> findOrder(int numCourses, vector<vector<int>>& prerequisites) {\n        vector<vector<int>> g(numCourses);\n        vector<int> indeg(numCourses, 0);\n        for (auto& p : prerequisites) { g[p[1]].push_back(p[0]); indeg[p[0]]++; }\n        queue<int> q;\n        for (int i=0;i<numCourses;i++) if (indeg[i]==0) q.push(i);\n        vector<int> order;\n        while (!q.empty()) {\n            int u=q.front(); q.pop(); order.push_back(u);\n            for (int v : g[u]) if (--indeg[v]==0) q.push(v);\n        }\n        if ((int)order.size()==numCourses) return order;\n        return {};\n    }\n};","codeLang":"cpp","codeSource":"AI 生成","hints":["留意要返回一个合法修课顺序，而非仅判断。","考虑拓扑排序，出队顺序即所求。","Kahn：order 记录出队顺序，cnt==numCourses 返回 order，否则返回空数组。"]},{"id":"gr-007","category":"图论/并查集","title":"克隆图","source":"LeetCode 133","difficulty":"中等","tags":["DFS","BFS","图"],"statement":"给定无向连通图的一个节点引用 node，图的每个节点有 val 和邻居列表 neighbors。返回该图的深拷贝。","analysis":"DFS 哈希映射记录已克隆节点。从 node 出发递归遍历，若 mp 中已存在则直接返回，否则创建新节点并递归克隆其每个邻居加入 neighbors。\n关键点：哈希表去重防止重复克隆和循环。\n时间复杂度 O(V+E)，空间 O(V)。","code":"/*\nclass Node {\npublic:\n    int val;\n    vector<Node*> neighbors;\n    Node() { val=0; neighbors=vector<Node*>(); }\n    Node(int _val) { val=_val; neighbors=vector<Node*>(); }\n    Node(int _val, vector<Node*> _neighbors) { val=_val; neighbors=_neighbors; }\n};\n*/\nclass Solution {\npublic:\n    unordered_map<Node*, Node*> mp;\n    Node* cloneGraph(Node* node) {\n        if (!node) return nullptr;\n        if (mp.count(node)) return mp[node];\n        mp[node] = new Node(node->val);\n        for (Node* nb : node->neighbors)\n            mp[node]->neighbors.push_back(cloneGraph(nb));\n        return mp[node];\n    }\n};","codeLang":"cpp","codeSource":"AI 生成","hints":["留意要的是『深拷贝』，节点和邻居关系都要新建。","考虑用哈希表记录原节点到克隆节点的映射，防止重复克隆和循环。","DFS：mp 映射原节点→新节点；未创建则新建并递归克隆每个邻居加入 neighbors，已存在直接返回。"]},{"id":"gr-008","category":"图论/并查集","title":"网络延迟时间","source":"LeetCode 743","difficulty":"中等","tags":["Dijkstra","最短路","堆"],"statement":"有 n 个网络节点 1..n，times[i]=[u,v,w] 表示从 u 到 v 信号延迟 w。从节点 k 发送信号，求所有节点收到信号的时间；若有节点不可达返回 -1。","analysis":"单源最短路 Dijkstra（堆优化）。建邻接表，dist 初始化为 INF，dist[k]=0，小根堆取出最小距离节点松弛邻居，若 d>dist[u] 跳过。\n答案为 dist 最大值；若仍为 INF 则不可达返回 -1。\n关键点：惰性删除，greater 比较器。\n时间复杂度 O(E log V)，空间 O(V+E)。","code":"class Solution {\npublic:\n    int networkDelayTime(vector<vector<int>>& times, int n, int k) {\n        vector<vector<pair<int,int>>> g(n+1);\n        for (auto& t : times) g[t[0]].push_back({t[1], t[2]});\n        const int INF = 1e9;\n        vector<int> dist(n+1, INF);\n        dist[k] = 0;\n        priority_queue<pair<int,int>, vector<pair<int,int>>, greater<pair<int,int>>> pq;\n        pq.push({0, k});\n        while (!pq.empty()) {\n            auto [d, u] = pq.top(); pq.pop();\n            if (d > dist[u]) continue;\n            for (auto& [v, w] : g[u]) {\n                if (dist[u]+w < dist[v]) {\n                    dist[v] = dist[u]+w;\n                    pq.push({dist[v], v});\n                }\n            }\n        }\n        int ans = 0;\n        for (int i=1;i<=n;i++) {\n            if (dist[i]==INF) return -1;\n            ans = max(ans, dist[i]);\n        }\n        return ans;\n    }\n};","codeLang":"cpp","codeSource":"AI 生成","hints":["留意求的是所有节点收到信号的最晚时间，即单源最短路的最大值。","考虑边权非负，用堆优化的单源最短路算法。","Dijkstra：dist[k]=0 其余 INF，小根堆取最小松弛邻居；答案为 dist 最大值，仍 INF 则 -1。"]},{"id":"gr-009","category":"图论/并查集","title":"K 站中转内最便宜的航班","source":"LeetCode 787","difficulty":"中等","tags":["Bellman-Ford","最短路"],"statement":"有 n 个城市，flights[i]=[from,to,price]。从 src 出发到 dst，最多经过 k 站中转（即最多 k+1 条边），求最便宜价格；若无解返回 -1。","analysis":"Bellman-Ford 限制松弛轮数。执行 k+1 轮，每轮用上一轮 dist 的副本更新（避免同轮内连锁更新超过边数限制）。最终若 dist[dst] 仍为 INF 返回 -1。\n关键点：用 cur 副本保证每轮只松弛一条边。\n时间复杂度 O(k · E)，空间 O(V)。","code":"class Solution {\npublic:\n    int findCheapestPrice(int n, vector<vector<int>>& flights, int src, int dst, int k) {\n        const int INF = 1e9;\n        vector<int> dist(n, INF);\n        dist[src] = 0;\n        for (int i=0;i<=k;i++) {\n            vector<int> cur = dist;\n            for (auto& f : flights) {\n                int u=f[0], v=f[1], w=f[2];\n                if (cur[u]!=INF && cur[u]+w < dist[v])\n                    dist[v] = cur[u]+w;\n            }\n        }\n        return dist[dst]==INF ? -1 : dist[dst];\n    }\n};","codeLang":"cpp","codeSource":"AI 生成","hints":["留意『最多 k 站中转』即最多 k+1 条边的边数限制。","考虑限制松弛轮数的最短路算法。","Bellman-Ford：执行 k+1 轮，每轮用上一轮 dist 副本更新防连锁；dist[dst] 仍 INF 则 -1。"]},{"id":"st-1","category":"字符串/KMP","title":"反转字符串","source":"LeetCode 344","difficulty":"简单","tags":["双指针","字符串"],"statement":"编写一个函数，其作用是将输入的字符串反转过来。输入字符串以字符数组 s 的形式给出。\n\n你必须原地修改输入数组，并使用 O(1) 额外空间来完成。\n\n示例 1：\n输入：s = ['h','e','l','l','o']\n输出：['o','l','l','e','h']\n\n示例 2：\n输入：s = ['H','a','n','n','a','h']\n输出：['h','a','n','n','a','H']\n\n约束：1 <= s.length <= 10^5，s[i] 为可打印的 ASCII 字符。","analysis":"思路：经典双指针对撞。设 left=0, right=n-1，每次交换 s[left] 与 s[right]，然后 left++、right--，直到 left>=right。\n\n关键点：原地操作，仅用临时变量做交换，空间 O(1)。时间 O(n)。面试考察手写实现而非库函数。","code":"class Solution {\npublic:\n    void reverseString(vector<char>& s) {\n        int l = 0, r = (int)s.size() - 1;\n        while (l < r) {\n            swap(s[l], s[r]);\n            ++l; --r;\n        }\n    }\n};","codeLang":"cpp","codeSource":"AI 生成","hints":["留意要求原地、O(1) 额外空间。","考虑两个指针从两端向中间走。","left=0,right=n-1，交换 s[left],s[right] 后 left++ right--，直到相遇。"]},{"id":"st-2","category":"字符串/KMP","title":"反转字符串 II","source":"LeetCode 541","difficulty":"中等","tags":["双指针","字符串","模拟"],"statement":"给定一个字符串 s 和一个整数 k，从字符串开头算起，每计数至 2k 个字符，就反转这 2k 个字符中的前 k 个字符。\n\n- 如果剩余字符少于 k 个，则将剩余字符全部反转。\n- 如果剩余字符小于 2k 但大于或等于 k 个，则反转前 k 个字符，其余字符保持原样。\n\n示例 1：\n输入：s = 'abcdefg', k = 2\n输出：'bacdfeg'\n\n示例 2：\n输入：s = 'abcd', k = 2\n输出：'bacd'\n\n约束：1 <= s.length <= 10^4，s 由小写英文字母组成，1 <= k <= 10^4。","analysis":"思路：按 2k 为步长遍历字符串，每一段起点 i，区间 [i, i+k) 即需要反转的前 k 个；若该段不足 k 则反转到末尾。\n\n关键点：使用 std::reverse 的区间 [first, last) 语义：reverse(s.begin()+i, s.begin()+min(i+k, n))。注意 i 的步长是 2k，不是 k。\n\n时间 O(n)，空间 O(1)。","code":"class Solution {\npublic:\n    string reverseStr(string s, int k) {\n        int n = (int)s.size();\n        for (int i = 0; i < n; i += 2 * k) {\n            int r = min(i + k, n);\n            reverse(s.begin() + i, s.begin() + r);\n        }\n        return s;\n    }\n};","codeLang":"cpp","codeSource":"AI 生成","hints":["留意步长是 2k，且每段只反转前 k 个。","考虑按 2k 步长遍历，对每段前 k 个区间做反转。","i 步长 2k，reverse(s.begin()+i, s.begin()+min(i+k,n))。"]},{"id":"st-3","category":"字符串/KMP","title":"反转字符串里的单词","source":"LeetCode 151","difficulty":"中等","tags":["双指针","字符串","模拟"],"statement":"给你一个字符串 s，请你反转字符串中单词的顺序。\n\n单词定义为：由非空格字符组成的连续序列。s 中的单词之间由一个或多个空格分隔。返回一个单词顺序反转、且单词间仅用单个空格连接、且无前导/后缀空格的字符串。\n\n示例 1：\n输入：s = 'the sky is blue'\n输出：'blue is sky the'\n\n示例 2：\n输入：s = '  hello   world  '\n输出：'world hello'","analysis":"思路：经典三步法，全程 O(1) 额外空间（在原串上操作）。\n1) 整体反转字符串；\n2) 逐个单词反转回来（这样单词内部字母恢复原序，但单词顺序已整体颠倒）；\n3) 去除多余空格：双指针原地压缩，遇到连续空格只保留一个，并删去首尾空格。\n\n关键点：去空格和反转的顺序可调换，但三步法最清晰。面试常考「不使用库函数 split」的版本。\n\n时间 O(n)，空间 O(1)（双指针覆盖再 resize）。","code":"class Solution {\npublic:\n    string reverseWords(string s) {\n        // 1. 整体反转\n        reverse(s.begin(), s.end());\n        int n = (int)s.size();\n        // 2. 原地压缩多余空格 + 逐词反转\n        int write = 0;\n        for (int read = 0; read < n; ++read) {\n            if (s[read] != ' ') {\n                if (write > 0) s[write++] = ' ';            // 单词间补一个空格\n                int start = write;\n                while (read < n && s[read] != ' ') {\n                    s[write++] = s[read++];\n                }\n                reverse(s.begin() + start, s.begin() + write); // 反转当前单词\n                --read; // 外层 ++read 会补回\n            }\n        }\n        s.resize(write);\n        return s;\n    }\n};","codeLang":"cpp","codeSource":"AI 生成","hints":["留意要同时反转单词顺序、压缩多余空格、去首尾空格。","考虑整体反转后逐个单词再反转回来的三步法。","整体反转→逐词反转→双指针原地压缩多余空格，全程 O(1) 额外空间。"]},{"id":"st-4","category":"字符串/KMP","title":"无重复字符的最长子串","source":"LeetCode 3","difficulty":"中等","tags":["滑动窗口","哈希表","字符串"],"statement":"给定一个字符串 s，请你找出其中不含有重复字符的最长子串（连续）的长度。\n\n示例 1：\n输入：s = 'abcabcbb'\n输出：3\n解释：最长无重复子串为 'abc'，长度为 3。\n\n示例 2：\n输入：s = 'bbbbb'\n输出：1\n\n示例 3：\n输入：s = 'pwwkew'\n输出：3\n解释：最长无重复子串为 'wke'。","analysis":"思路：滑动窗口。维护窗口 [left, right] 内字符均不重复，用哈希表记录每个字符最近出现的位置。\n当 s[right] 已在窗口内（其上次出现位置 last >= left）时，将 left 跳到 last+1 收缩窗口；否则扩大窗口并更新答案。\n\n关键点：用数组 cnt[128] 记录位置。left 直接跳到 last+1，而不是逐个右移——这是 O(n) 而非 O(n^2) 的关键。必须判断 last >= left，否则会把窗口外的旧记录误判为重复。\n\n时间 O(n)，空间 O(Σ)。","code":"class Solution {\npublic:\n    int lengthOfLongestSubstring(string s) {\n        int n = (int)s.size();\n        int last[128];\n        fill(last, last + 128, -1);\n        int left = 0, ans = 0;\n        for (int right = 0; right < n; ++right) {\n            char c = s[right];\n            if (last[c] >= left) {\n                left = last[c] + 1;\n            }\n            last[c] = right;\n            ans = max(ans, right - left + 1);\n        }\n        return ans;\n    }\n};","codeLang":"cpp","codeSource":"AI 生成","hints":["留意子串要连续且不含重复字符。","考虑滑动窗口维护无重复的一段。","用哈希表记每字符最近位置，遇重复则 left 跳到 last+1，更新最长；判断 last>=left 防误判。"]},{"id":"st-5","category":"字符串/KMP","title":"最小覆盖子串","source":"LeetCode 76","difficulty":"困难","tags":["滑动窗口","哈希表","字符串"],"statement":"给你一个字符串 s、一个字符串 t。返回 s 中涵盖 t 所有字符的最小子串（连续）。如果 s 中不存在这样的子串，返回空串。\n\n题目保证 t 中字符的重复数会被计入：若 t 中有 2 个 'a'，则覆盖子串中 'a' 也至少 2 个。\n\n示例 1：\n输入：s = 'ADOBECODEBANC', t = 'ABC'\n输出：'BANC'\n\n示例 2：\n输入：s = 'a', t = 'a'\n输出：'a'","analysis":"思路：滑动窗口 + 计数。用 need[128] 记录 t 中各字符需求，valid 表示窗口内已满足的种类数。\n\n流程：\n1) 右指针 right 扩展窗口，加入 s[right]；若该字符是需求字符且加入后窗口内该字符数 == 需求数，valid++。\n2) 当 valid == 需求种类总数 needCount 时，窗口合法，尝试收缩左指针 left：若 s[left] 是需求字符且窗口内该字符数 == 需求数，则 valid--；弹出 s[left]，left++。每次合法时更新最短答案。\n\n关键点：用「需求种类数 valid == needCount」作为合法判据。字符集为 ASCII，用数组代替 map。\n\n时间 O(n)，空间 O(Σ)。","code":"class Solution {\npublic:\n    string minWindow(string s, string t) {\n        int need[128] = {0};\n        int needCount = 0;       // t 中不同字符种类数\n        for (char c : t) {\n            if (need[c]++ == 0) ++needCount;\n        }\n        int window[128] = {0};\n        int valid = 0, left = 0, minLen = INT_MAX, start = 0;\n        for (int right = 0; right < (int)s.size(); ++right) {\n            char c = s[right];\n            if (need[c] > 0 && ++window[c] == need[c]) ++valid;\n            while (valid == needCount) {\n                if (right - left + 1 < minLen) {\n                    minLen = right - left + 1;\n                    start = left;\n                }\n                char d = s[left++];\n                if (need[d] > 0) {\n                    if (window[d]-- == need[d]) --valid;\n                }\n            }\n        }\n        return minLen == INT_MAX ? \"\" : s.substr(start, minLen);\n    }\n};","codeLang":"cpp","codeSource":"AI 生成","hints":["留意 t 中重复字符数也要被覆盖，求最短连续子串。","考虑滑动窗口加计数，先扩右再缩左找最短。","need 记需求、valid 记已满足种类数；valid==needCount 时缩左更新最短，合法判据用种类满足数。"]},{"id":"st-6","category":"字符串/KMP","title":"实现 strStr()","source":"LeetCode 28","difficulty":"中等","tags":["KMP","字符串匹配","双指针"],"statement":"实现 strStr(str, needle) 函数。\n\n给定两个字符串 haystack 和 needle，在 haystack 字符串中找出 needle 字符串出现的第一个位置（下标从 0 开始）。如果不存在，返回 -1。\n\n说明：当 needle 是空字符串时，返回 0。本题考察 KMP 算法，要求 O(n+m) 时间。\n\n示例 1：\n输入：haystack = 'hello', needle = 'll'\n输出：2\n\n示例 2：\n输入：haystack = 'aaaaa', needle = 'bba'\n输出：-1","analysis":"思路：KMP 算法。核心是构造 next 数组（又称部分匹配表 / 失败指针），表示模式串每个前缀的最长「真前后缀」公共长度，用于匹配失败时模式串向右滑动而主串指针不回溯。\n\nnext 数组构造：用 j 表示当前最长相等前后缀长度，遍历 i 从 1 到 m-1：当 needle[i] != needle[j] 且 j>0 时，j = next[j-1]（不断回跳）；若 needle[i]==needle[j]，j++；next[i] = j。\n\n匹配阶段：i 遍历主串，j 为模式串已匹配长度；失配时 j=next[j-1]，匹配时 j++；当 j==m 命中，返回 i-m+1。\n\n关键点：next 数组是 KMP 的灵魂。时间 O(n+m)，空间 O(m)。面试常被要求现场手写 next。","code":"class Solution {\npublic:\n    int strStr(string haystack, string needle) {\n        if (needle.empty()) return 0;\n        int n = (int)haystack.size(), m = (int)needle.size();\n        // 构建 next 数组\n        vector<int> nxt(m, 0);\n        for (int i = 1, j = 0; i < m; ++i) {\n            while (j > 0 && needle[i] != needle[j]) j = nxt[j - 1];\n            if (needle[i] == needle[j]) ++j;\n            nxt[i] = j;\n        }\n        // 匹配\n        for (int i = 0, j = 0; i < n; ++i) {\n            while (j > 0 && haystack[i] != needle[j]) j = nxt[j - 1];\n            if (haystack[i] == needle[j]) ++j;\n            if (j == m) return i - m + 1;\n        }\n        return -1;\n    }\n};","codeLang":"cpp","codeSource":"OI Wiki (https://oi-wiki.org/string/kmp/)","hints":["留意要求 O(n+m) 时间，朴素双指针会退化。","考虑构造模式串的失败指针数组，使主串指针不回溯。","KMP：先建 next 数组（最长相等前后缀），匹配失配时 j=next[j-1]，j==m 时返回 i-m+1。"]},{"id":"st-7","category":"字符串/KMP","title":"重复的子字符串","source":"LeetCode 459","difficulty":"中等","tags":["KMP","next 数组","字符串"],"statement":"给定一个非空的字符串 s，检查它是否可以由它的一个子串重复多次拼接而成。\n\n示例 1：\n输入：s = 'abab'\n输出：True\n解释：可由子串 'ab' 重复 2 次构成。\n\n示例 2：\n输入：s = 'aba'\n输出：False\n\n示例 3：\n输入：s = 'abcabcabcabc'\n输出：True","analysis":"思路：利用 KMP 的 next 数组性质。设 s 长度为 n，next[n-1] 为 s 最长相等前后缀长度 L。\n- 若 s 可由长度为 p 的子串重复构成，则 n 是 p 的倍数，且 p = n - L。\n- 反之，若 next[n-1] > 0 且 n % (n - L) == 0，则 s 可由前 n-L 个字符重复构成。\n\n直观理解：最长相等前后缀意味着 s 的前 L 个与后 L 个相同；若 n 是 (n-L) 的整数倍，说明整串可被周期 (n-L) 完整切分。\n\n关键点：必须 L>0，否则 n-L==n，n%n==0 恒成立会误判。\n\n时间 O(n)，空间 O(n)。","code":"class Solution {\npublic:\n    bool repeatedSubstringPattern(string s) {\n        int n = (int)s.size();\n        vector<int> nxt(n, 0);\n        for (int i = 1, j = 0; i < n; ++i) {\n            while (j > 0 && s[i] != s[j]) j = nxt[j - 1];\n            if (s[i] == s[j]) ++j;\n            nxt[i] = j;\n        }\n        int L = nxt[n - 1];\n        return L > 0 && n % (n - L) == 0;\n    }\n};","codeLang":"cpp","codeSource":"OI Wiki (https://oi-wiki.org/string/kmp/)","hints":["留意问的是『能否由某子串重复拼接』，找周期性。","考虑用模式串自身的最长相等前后缀长度。","KMP next 数组：设 L=next[n-1]，若 L>0 且 n%(n-L)==0 则可由前 n-L 个字符重复构成。"]},{"id":"st-8","category":"字符串/KMP","title":"字符串哈希 / Rabin-Karp 入门","source":"AI 自出（常见考点）","difficulty":"中等","tags":["字符串哈希","Rabin-Karp","滚动哈希"],"statement":"给定主串 S 和模式串 P（仅含小写字母），请用 Rabin-Karp 滚动哈希方法，输出 P 在 S 中所有出现的起始下标（升序，下标从 0 开始）。若无出现则输出空。\n\n要求使用多项式滚动哈希（base 为质数 b，模数 mod），并通过预计算 b 的幂避免重复乘法。\n\n输入格式：\n第一行字符串 S，第二行字符串 P。\n输出格式：\n一行空格分隔的下标；若无匹配输出 -1。\n\n示例：\n输入：\nabababab\nab\n输出：0 2 4 6\n\n数据范围：1 <= |S|, |P| <= 10^6，|P| <= |S|。","analysis":"思路：多项式滚动哈希。把字符串视为以 b 为进制的数：\nH(s[l..r]) = (s[l]*b^{r-l} + s[l+1]*b^{r-l-1} + ... + s[r]) mod mod\n\n预处理：\n- powb[i] = b^i mod mod\n- pref[i] = S 前 i 个字符的哈希前缀和，pref[i] = (pref[i-1]*b + S[i-1]) mod mod\n则子串 S[l..r]（0-index，长度 len=r-l+1）的哈希为：\nh(l,r) = (pref[r+1] - pref[l]*powb[len]) mod mod（取模后加 mod 再取模防负）。\n\n匹配：先算 P 的哈希 hp，再对 S 中每个长度为 |P| 的窗口用 O(1) 滚动求哈希比较；相等则记录下标。\n\n关键点：字符值要 +1（'a' 映射为 1..26），避免前导零导致不同串同哈希。单模数有冲突概率；面试可提双模数或自然溢出降低冲突。时间 O(n+m)，与 KMP 同阶但实现更直观。\n与 KMP 对比：KMP 失败指针提供精确后继，无冲突；哈希实现简单但理论有冲突。","code":"#include <bits/stdc++.h>\nusing namespace std;\n\nint main() {\n    const long long b = 131LL, mod = 1000000007LL;\n    string S, P;\n    if (!(cin >> S >> P)) return 0;\n    int n = (int)S.size(), m = (int)P.size();\n    if (m > n) { cout << -1; return 0; }\n\n    vector<long long> powb(n + 1, 0), pref(n + 1, 0);\n    powb[0] = 1;\n    for (int i = 1; i <= n; ++i) powb[i] = powb[i - 1] * b % mod;\n    for (int i = 1; i <= n; ++i)\n        pref[i] = (pref[i - 1] * b % mod + (S[i - 1] - 'a' + 1)) % mod;\n\n    long long hp = 0;\n    for (char c : P) hp = (hp * b % mod + (c - 'a' + 1)) % mod;\n\n    vector<int> ans;\n    for (int i = 0; i + m - 1 < n; ++i) {\n        long long h = (pref[i + m] - pref[i] * powb[m] % mod + mod) % mod;\n        if (h == hp) ans.push_back(i);\n    }\n\n    if (ans.empty()) cout << -1;\n    else for (int i = 0; i < (int)ans.size(); ++i)\n        cout << ans[i] << (i + 1 == (int)ans.size() ? '\\n' : ' ');\n    return 0;\n}","codeLang":"cpp","codeSource":"AI 生成","hints":["留意要在主串中找模式串所有出现位置，数据范围大。","考虑用滚动哈希 O(1) 比较每个窗口。","多项式滚动哈希：预处理 powb 与前缀哈希 pref，子串哈希=pref[r+1]-pref[l]*powb[len]；字符值+1 防前导零。"]},{"id":"bit-1","category":"树状数组与线段树","title":"树状数组模板 1（单点修改，区间查询）","source":"洛谷 P3374","difficulty":"中等","tags":["树状数组","前缀和"],"statement":"给定长度为 n 的数列 a[1..n]，需要支持 m 次操作：\n1 x k：将 a[x] 增加 k；\n2 x y：求 a[x]+a[x+1]+...+a[y] 的和。\n1≤n,m≤5×10^5，保证结果在 int 范围内。\n输入格式：第一行 n m；第二行 n 个数；接下来 m 行每行一个操作。","analysis":"最经典的树状数组（Fenwick / BIT）应用。利用 lowbit(x)=x&-x 将前缀和拆成 O(log n) 段，单点修改与区间查询都是 O(log n)。\n关键点：树状数组 c[i] 维护区间 [i-lowbit(i)+1, i] 的和；update 在 i 及其祖先位置加值；query 前缀和后用 sum(y)-sum(x-1) 得到区间和。\n时间 O((n+m) log n)，空间 O(n)。","code":"#include <bits/stdc++.h>\nusing namespace std;\nint n,m,c[500005];\nint lowbit(int x){return x&-x;}\nvoid update(int i,int k){for(;i<=n;i+=lowbit(i))c[i]+=k;}\nint query(int i){int s=0;for(;i>0;i-=lowbit(i))s+=c[i];return s;}\nint main(){\n    scanf(\"%d%d\",&n,&m);\n    for(int i=1;i<=n;i++){int a;scanf(\"%d\",&a);update(i,a);}\n    while(m--){\n        int op,x,y;scanf(\"%d%d%d\",&op,&x,&y);\n        if(op==1)update(x,y);\n        else printf(\"%d\\n\",query(y)-query(x-1));\n    }\n    return 0;\n}","codeLang":"cpp","codeSource":"OI Wiki (https://oi-wiki.org/ds/fenwick/)","hints":["留意要同时支持单点修改和区间求和，朴素前缀和修改太慢。","考虑一种借助 lowbit 把前缀和拆成 O(log n) 段的结构。","树状数组：c[i] 维护 [i-lowbit(i)+1,i] 的和；update 沿祖先加值，query 前缀和后 sum(y)-sum(x-1)。"]},{"id":"bit-2","category":"树状数组与线段树","title":"树状数组模板 2（区间修改，单点查询）","source":"洛谷 P3368","difficulty":"中等","tags":["树状数组","差分"],"statement":"给定长度为 n 的数列 a[1..n]，需要支持 m 次操作：\n1 x y k：将区间 [x,y] 内每个数加上 k；\n2 x：查询 a[x] 的值。\n1≤n,m≤5×10^5。\n输入格式：第一行 n m；第二行 n 个数表示初始数列；接下来 m 行每行一个操作。","analysis":"利用差分思想：令 d[i]=a[i]-a[i-1]，则 a[x]=d[1]+...+d[x]，即差分数组的前缀和。\n区间 [x,y] 加 k 等价于 d[x]+=k，d[y+1]-=k；单点查询 a[x] 等价于求 d 的前缀和到 x。\n于是把树状数组直接维护在差分数组 d 上：update 为区间修改（两个单点修改），query 为前缀和。\n时间 O((n+m) log n)，空间 O(n)。关键点：差分把「区间改-单点查」转成「单点改-区间查」，恰好契合树状数组的强项。","code":"#include <bits/stdc++.h>\nusing namespace std;\nint n,m,c[500005];\nint lowbit(int x){return x&-x;}\nvoid update(int i,int k){for(;i<=n;i+=lowbit(i))c[i]+=k;}\nint query(int i){int s=0;for(;i>0;i-=lowbit(i))s+=c[i];return s;}\nint main(){\n    scanf(\"%d%d\",&n,&m);\n    int pre=0;\n    for(int i=1;i<=n;i++){int a;scanf(\"%d\",&a);update(i,a-pre);pre=a;}\n    while(m--){\n        int op;scanf(\"%d\",&op);\n        if(op==1){int x,y,k;scanf(\"%d%d%d\",&x,&y,&k);update(x,k);update(y+1,-k);}\n        else{int x;scanf(\"%d\",&x);printf(\"%d\\n\",query(x));}\n    }\n    return 0;\n}","codeLang":"cpp","codeSource":"OI Wiki (https://oi-wiki.org/ds/fenwick/)","hints":["留意这次是『区间改、单点查』，与模板 1 相反。","考虑差分数组，把区间改转成两个单点改。","维护差分 d：区间 [x,y] 加 k 即 d[x]+=k,d[y+1]-=k；查 a[x] 即 d 的前缀和到 x，套用树状数组。"]},{"id":"bit-3","category":"树状数组与线段树","title":"区域和检索 - 数组可修改","source":"LeetCode 307","difficulty":"中等","tags":["树状数组","线段树","前缀和"],"statement":"给你一个数组 nums，支持两种操作：\n1. update(index, val)：将 nums[index] 修改为 val；\n2. sumRange(left, right)：返回 nums[left..right] 的元素和。\n最多调用 3×10^4 次上述方法。请实现 NumArray 类，使得每次操作尽可能高效。","analysis":"朴素前缀和每次 update 是 O(n)，不满足频繁修改。用树状数组：维护前缀和，单点更新 O(log n)，区间查询 O(log n)。\n关键点：update(index,val) 需要知道原值才能算差值 diff=val-nums[index]，因此额外保留原数组 a[] 记录当前值；sumRange(l,r)=sum(r+1)-sum(l)（下标从 0 开始，树状数组下标从 1 开始，故 +1 偏移）。\n也可用线段树实现，复杂度相同但常数略大。时间 O(log n) 每次，空间 O(n)。","code":"class NumArray {\n    vector<int> c, a;\n    int n;\n    void add(int i,int k){for(;i<=n;i+=i&-i)c[i]+=k;}\n    int sum(int i){int s=0;for(;i>0;i-=i&-i)s+=c[i];return s;}\npublic:\n    NumArray(vector<int>& nums){\n        n=nums.size();\n        c.assign(n+1,0);\n        a=nums;\n        for(int i=0;i<n;i++)add(i+1,nums[i]);\n    }\n    void update(int index,int val){\n        add(index+1,val-a[index]);\n        a[index]=val;\n    }\n    int sumRange(int left,int right){\n        return sum(right+1)-sum(left);\n    }\n};\n\n/* 用法：\n   NumArray obj(nums);\n   obj.update(index,val);\n   obj.sumRange(left,right);\n*/","codeLang":"cpp","codeSource":"AI 生成","hints":["留意既要频繁单点修改又要频繁区间求和，朴素前缀和修改 O(n)。","考虑用树状数组把两种操作都降到 O(log n)。","保留原数组 a 算 diff=val-a[idx]；update 沿祖先加 diff；sumRange(l,r)=sum(r+1)-sum(l)（下标偏移 1）。"]},{"id":"bit-4","category":"树状数组与线段树","title":"计算右侧小于当前元素的个数","source":"LeetCode 315","difficulty":"困难","tags":["树状数组","离散化","逆序对"],"statement":"给定一个整数数组 nums，返回一个数组 counts，其中 counts[i] 表示 nums[i] 右侧小于 nums[i] 的元素个数。\n1≤nums.length≤10^5，-10^4≤nums[i]≤10^4。\n示例：输入 [5,2,6,3]，输出 [2,1,1,0]。","analysis":"从右往左扫描，维护一个「已经出现的数」的集合，对每个 nums[i] 查询「严格小于 nums[i] 的出现次数」，这就是右侧更小元素个数——经典的树状数组求逆序对模型。\n关键点1（离散化）：值域较大但数量有限，先排序去重，把数值映射到 1..m 的排名，树状数组下标即排名。\n关键点2（顺序）：从右往左处理，处理 nums[i] 时树状数组里装的是它右侧已出现元素；查询排名 r-1 的前缀和即得小于它的个数；再把 r 加入树状数组。\n时间 O(n log n)，空间 O(n)。也可用归并排序求逆序对。","code":"class Solution {\npublic:\n    vector<int> countSmaller(vector<int>& nums){\n        int n=nums.size();\n        vector<int> b=nums;\n        sort(b.begin(),b.end());\n        b.erase(unique(b.begin(),b.end()),b.end());\n        int m=b.size();\n        vector<int> c(m+2,0);\n        auto add=[&](int i){for(;i<=m;i+=i&-i)c[i]++;};\n        auto query=[&](int i){int s=0;for(;i>0;i-=i&-i)s+=c[i];return s;};\n        vector<int> res(n);\n        for(int i=n-1;i>=0;i--){\n            int r=lower_bound(b.begin(),b.end(),nums[i])-b.begin()+1;\n            res[i]=query(r-1);\n            add(r);\n        }\n        return res;\n    }\n};","codeLang":"cpp","codeSource":"AI 生成","hints":["留意是『右侧小于当前』的个数，典型的逆序对变体。","考虑从右往左扫，维护已出现数的频次并查询小于当前值的次数。","树状数组求逆序对：值域大先离散化；从右往左处理，查排名 r-1 前缀和得个数，再把 r 加入树状数组。"]},{"id":"bit-5","category":"树状数组与线段树","title":"线段树模板 1（区间加，区间求和）","source":"洛谷 P3372","difficulty":"中等","tags":["线段树","lazy标记","区间修改"],"statement":"如题，已知一个数列 a[1..n]，需要支持 m 次操作：\n1 x y k：将区间 [x,y] 内每个数加上 k；\n2 x y：输出区间 [x,y] 内每个数的和。\n1≤n,m≤10^5，保证数据在 long long 范围内。\n输入格式：第一行 n m；第二行 n 个数；接下来 m 行每行一个操作。","analysis":"线段树 + lazy（延迟）标记的模板题。区间修改若逐点改会退化到 O(n)，引入 lazy 标记：访问到完全覆盖的节点时只修改该节点并打标记，不下传；只有需要继续访问子节点时才 pushdown。\n关键点：\n- 节点 sum[p] 维护区间和，lazy[p] 记录「本区间每个元素待加的值」；\n- 打 lazy 时 sum[p]+=lazy*(len)，并把 lazy 累加传给子节点；\n- pushdown 在递归到子节点前调用。\n时间 O((n+m) log n)，空间 O(4n)。注意 long long。","code":"#include <bits/stdc++.h>\nusing namespace std;\ntypedef long long ll;\nconst int N=100005;\nll a[N],sum[4*N],lazy[4*N];\nvoid build(int p,int l,int r){\n    if(l==r){sum[p]=a[l];return;}\n    int mid=(l+r)/2;\n    build(2*p,l,mid);build(2*p+1,mid+1,r);\n    sum[p]=sum[2*p]+sum[2*p+1];\n}\nvoid pushdown(int p,int l,int r){\n    if(lazy[p]){\n        int mid=(l+r)/2;\n        sum[2*p]+=lazy[p]*(mid-l+1);\n        lazy[2*p]+=lazy[p];\n        sum[2*p+1]+=lazy[p]*(r-mid);\n        lazy[2*p+1]+=lazy[p];\n        lazy[p]=0;\n    }\n}\nvoid update(int p,int l,int r,int x,int y,ll k){\n    if(x<=l&&r<=y){sum[p]+=k*(r-l+1);lazy[p]+=k;return;}\n    pushdown(p,l,r);\n    int mid=(l+r)/2;\n    if(x<=mid)update(2*p,l,mid,x,y,k);\n    if(y>mid)update(2*p+1,mid+1,r,x,y,k);\n    sum[p]=sum[2*p]+sum[2*p+1];\n}\nll query(int p,int l,int r,int x,int y){\n    if(x<=l&&r<=y)return sum[p];\n    pushdown(p,l,r);\n    int mid=(l+r)/2;\n    ll res=0;\n    if(x<=mid)res+=query(2*p,l,mid,x,y);\n    if(y>mid)res+=query(2*p+1,mid+1,r,x,y);\n    return res;\n}\nint main(){\n    int n,m;scanf(\"%d%d\",&n,&m);\n    for(int i=1;i<=n;i++)scanf(\"%lld\",&a[i]);\n    build(1,1,n);\n    while(m--){\n        int op,x,y;scanf(\"%d%d%d\",&op,&x,&y);\n        if(op==1){ll k;scanf(\"%lld\",&k);update(1,1,n,x,y,k);}\n        else printf(\"%lld\\n\",query(1,1,n,x,y));\n    }\n    return 0;\n}","codeLang":"cpp","codeSource":"OI Wiki (https://oi-wiki.org/ds/seg/)","hints":["留意要支持区间加和区间求和，逐点改会退化。","考虑线段树加延迟标记，访问到完全覆盖节点时只改该节点不下传。","sum[p] 维护区间和，lazy[p] 记待加值；打 lazy 时 sum[p]+=lazy*len；递归子节点前 pushdown 下传。"]},{"id":"bit-6","category":"树状数组与线段树","title":"线段树模板 2（区间乘、区间加、区间求和）","source":"洛谷 P3373","difficulty":"困难","tags":["线段树","lazy标记","区间乘","取模"],"statement":"如题，已知数列 a[1..n]，需要支持 m 次操作：\n1 x y k：区间 [x,y] 内每个数乘上 k；\n2 x y k：区间 [x,y] 内每个数加上 k；\n3 x y：输出区间 [x,y] 内每个数的和对 p 取模的结果。\n1≤n,m≤10^5，1≤a[i],k≤10^9，p 为给定的模数（洛谷数据中 p=571373）。\n输入格式：第一行 n m p；第二行 n 个数；接下来 m 行每行一个操作。","analysis":"需要同时维护乘法和加法两种 lazy 标记。难点在于两个标记的「先后顺序」：对一段先乘 m 再加 t，等价于 sum=(sum*m+t*len)。\n关键点（下传策略）：维护 multag 初值 1、addtag 初值 0。下传时先处理乘法再处理加法：\n- 乘法标记下传：子节点 sum*=multag，子节点 multag*=multag，子节点 addtag*=multag（注意 addtag 也要乘！因为加法标记是在乘法之后产生的，必须跟着缩放）；\n- 加法标记下传：子节点 sum+=addtag*len，子节点 addtag+=addtag（multag 不变）。\n每次操作与取模务必及时，防止溢出。\n时间 O((n+m) log n)，空间 O(4n)。","code":"#include <bits/stdc++.h>\nusing namespace std;\ntypedef long long ll;\nconst int N=100005;\nll MOD,a[N],sum[4*N],addtag[4*N],multag[4*N];\nvoid build(int p,int l,int r){\n    multag[p]=1;addtag[p]=0;\n    if(l==r){sum[p]=a[l]%MOD;return;}\n    int mid=(l+r)/2;\n    build(2*p,l,mid);build(2*p+1,mid+1,r);\n    sum[p]=(sum[2*p]+sum[2*p+1])%MOD;\n}\nvoid pushdown(int p,int l,int r){\n    int mid=(l+r)/2;\n    if(multag[p]!=1){\n        sum[2*p]=sum[2*p]*multag[p]%MOD;\n        multag[2*p]=multag[2*p]*multag[p]%MOD;\n        addtag[2*p]=addtag[2*p]*multag[p]%MOD;\n        sum[2*p+1]=sum[2*p+1]*multag[p]%MOD;\n        multag[2*p+1]=multag[2*p+1]*multag[p]%MOD;\n        addtag[2*p+1]=addtag[2*p+1]*multag[p]%MOD;\n        multag[p]=1;\n    }\n    if(addtag[p]){\n        sum[2*p]=(sum[2*p]+addtag[p]*(mid-l+1))%MOD;\n        addtag[2*p]=(addtag[2*p]+addtag[p])%MOD;\n        sum[2*p+1]=(sum[2*p+1]+addtag[p]*(r-mid))%MOD;\n        addtag[2*p+1]=(addtag[2*p+1]+addtag[p])%MOD;\n        addtag[p]=0;\n    }\n}\nvoid updatemul(int p,int l,int r,int x,int y,ll k){\n    if(x<=l&&r<=y){sum[p]=sum[p]*k%MOD;multag[p]=multag[p]*k%MOD;addtag[p]=addtag[p]*k%MOD;return;}\n    pushdown(p,l,r);\n    int mid=(l+r)/2;\n    if(x<=mid)updatemul(2*p,l,mid,x,y,k);\n    if(y>mid)updatemul(2*p+1,mid+1,r,x,y,k);\n    sum[p]=(sum[2*p]+sum[2*p+1])%MOD;\n}\nvoid updateadd(int p,int l,int r,int x,int y,ll k){\n    if(x<=l&&r<=y){sum[p]=(sum[p]+k*(r-l+1))%MOD;addtag[p]=(addtag[p]+k)%MOD;return;}\n    pushdown(p,l,r);\n    int mid=(l+r)/2;\n    if(x<=mid)updateadd(2*p,l,mid,x,y,k);\n    if(y>mid)updateadd(2*p+1,mid+1,r,x,y,k);\n    sum[p]=(sum[2*p]+sum[2*p+1])%MOD;\n}\nll query(int p,int l,int r,int x,int y){\n    if(x<=l&&r<=y)return sum[p];\n    pushdown(p,l,r);\n    int mid=(l+r)/2;\n    ll res=0;\n    if(x<=mid)res+=query(2*p,l,mid,x,y);\n    if(y>mid)res+=query(2*p+1,mid+1,r,x,y);\n    return res%MOD;\n}\nint main(){\n    int n,m;scanf(\"%d%d%lld\",&n,&m,&MOD);\n    for(int i=1;i<=n;i++)scanf(\"%lld\",&a[i]);\n    build(1,1,n);\n    while(m--){\n        int op,x,y;scanf(\"%d%d%d\",&op,&x,&y);\n        if(op==1){ll k;scanf(\"%lld\",&k);updatemul(1,1,n,x,y,k);}\n        else if(op==2){ll k;scanf(\"%lld\",&k);updateadd(1,1,n,x,y,k);}\n        else printf(\"%lld\\n\",query(1,1,n,x,y));\n    }\n    return 0;\n}","codeLang":"cpp","codeSource":"OI Wiki (https://oi-wiki.org/ds/seg/)","hints":["留意同时有乘法和加法两种区间操作，难点在标记先后顺序。","考虑维护两个 lazy 标记，下传时先乘后加。","multag 初值 1、addtag 初值 0；乘法下传时子节点 addtag 也要乘 multag；加法下传只加 addtag*len。"]},{"id":"bit-7","category":"树状数组与线段树","title":"ST 表 / RMQ 区间最值模板","source":"洛谷 P3865","difficulty":"中等","tags":["ST表","RMQ","倍增"],"statement":"给定长度为 n 的数列 a[1..n]，m 次查询，每次给定 l,r，输出 max(a[l..r])。\n1≤n≤10^5，1≤m≤2×10^6，1≤a[i]≤10^9。\n输入格式：第一行 n m；第二行 n 个数；接下来 m 行每行 l r。","analysis":"ST 表是基于倍增的静态 RMQ 方法，适合「无修改、海量查询」场景。\n关键点：\n- st[j][i] 表示从 i 起长度 2^j 的区间最值；\n- 预处理 st[j][i]=max(st[j-1][i], st[j-1][i+(1<<(j-1))])，预处理 O(n log n)；\n- 查询 [l,r]：取 k=⌊log2(r-l+1)⌋，答案=max(st[k][l], st[k][r-2^k+1])，查询 O(1)。\n用预处理 lg[] 数组避免每次调用 log2，进一步加速。\n总时间 O(n log n + m)，空间 O(n log n)。","code":"#include <bits/stdc++.h>\nusing namespace std;\nconst int N=100005;\nint a[N],st[20][N],lg[N];\nint main(){\n    int n,m;scanf(\"%d%d\",&n,&m);\n    for(int i=1;i<=n;i++){scanf(\"%d\",&a[i]);st[0][i]=a[i];}\n    lg[1]=0;\n    for(int i=2;i<=n;i++)lg[i]=lg[i/2]+1;\n    for(int j=1;(1<<j)<=n;j++)\n        for(int i=1;i+(1<<j)-1<=n;i++)\n            st[j][i]=max(st[j-1][i],st[j-1][i+(1<<(j-1))]);\n    while(m--){\n        int l,r;scanf(\"%d%d\",&l,&r);\n        int k=lg[r-l+1];\n        printf(\"%d\\n\",max(st[k][l],st[k][r-(1<<k)+1]));\n    }\n    return 0;\n}","codeLang":"cpp","codeSource":"OI Wiki (https://oi-wiki.org/ds/sparse-table/)","hints":["留意是『无修改、海量查询』的静态区间最值。","考虑倍增预处理，查询用两个可重叠区间取最值。","ST 表：st[j][i] 为 i 起长度 2^j 的最值；查询 [l,r] 取 k=⌊log2(len)⌋，max(st[k][l],st[k][r-2^k+1])，O(1)。"]},{"id":"bit-8","category":"树状数组与线段树","title":"合并区间","source":"LeetCode 56","difficulty":"中等","tags":["区间问题","贪心","排序"],"statement":"给出若干区间的集合 intervals，其中单个区间为 intervals[i]=[starti, endi]。请合并所有重叠的区间，并返回一个不重叠的区间数组，该数组需覆盖输入中的所有区间。\n1≤intervals.length≤10^4，0≤starti≤endi≤10^4。\n示例：输入 [[1,3],[2,6],[8,10],[15,18]]，输出 [[1,6],[8,10],[15,18]]。","analysis":"区间问题入门题，排序后贪心合并。\n关键点：\n1. 按左端点升序排序，这样若发生重叠，必然是当前区间与结果中最后一个区间相邻；\n2. 遍历排序后的区间：若结果为空，或当前区间左端点 > 结果末尾右端点（无重叠），直接追加；否则有重叠，把结果末尾右端点更新为 max(原右端点, 当前右端点)（取 max 是因为区间包含关系：如 [1,5] 与 [2,3]）。\n时间 O(n log n)（排序），空间 O(n)（结果）。这是所有「区间合并/插入/覆盖」类题目的通用套路。","code":"class Solution {\npublic:\n    vector<vector<int>> merge(vector<vector<int>>& intervals){\n        sort(intervals.begin(),intervals.end());\n        vector<vector<int>> res;\n        for(auto& it:intervals){\n            if(res.empty()||res.back()[1]<it[0])res.push_back(it);\n            else res.back()[1]=max(res.back()[1],it[1]);\n        }\n        return res;\n    }\n};","codeLang":"cpp","codeSource":"AI 生成","hints":["留意要合并的是『重叠』区间，输出不重叠且覆盖全部输入。","考虑排序后贪心，按某端点排序使重叠只发生在相邻。","按左端点升序排序；遍历时若当前左>结果末尾右则追加，否则把结果末尾右更新为 max(原右,当前右)。"]}]</script>
<script>

    if(q.get("n")){ var n=parseInt(q.get("n"),10); if(n>=1&&n<=N){ curIdx=n-1; return; } }
