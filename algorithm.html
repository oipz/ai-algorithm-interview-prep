  })();

  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  // ===== lightweight C++ syntax highlighter =====
  var KW = ("auto break case const continue default do else enum extern for goto if inline namespace register return sizeof static struct switch typedef union virtual volatile while bool char double float int long short signed unsigned void NULL nullptr true false new delete this throw try catch operator template typename using public private protected class virtual override final static_cast dynamic_cast reinterpret_cast const_cast namespace std pair vector map set queue stack deque unordered_map unordered_set priority_queue string cin cout scanf printf sort max min push_back pop_back size begin end").split(" ");
  var KWSET = {}; KW.forEach(function(w){ KWSET[w]=1; });
  var PRE = "#include#define#define#else#endif#ifdef#ifndef#pragma#undef#elif#line#error";
  function hlCpp(src){
    var out=[], i=0, n=src.length;
    function isId(c){ return /[A-Za-z0-9_]/.test(c); }
    while(i<n){
      var c=src[i];
      // comment // ...
      if(c==='/'&&src[i+1]==='/'){ var j=src.indexOf('\n',i); if(j<0)j=n; out.push('<span class="com">'+esc(src.slice(i,j))+'</span>'); i=j; continue; }
      // comment /* */
      if(c==='/'&&src[i+1]==='*'){ var j=src.indexOf('*/',i+2); if(j<0)j=n; else j+=2; out.push('<span class="com">'+esc(src.slice(i,j))+'</span>'); i=j; continue; }
      // preprocessor line
      if(c==='#'){ var j=src.indexOf('\n',i); if(j<0)j=n;
        // handle line continuation backslash
        while(j>0 && src[j-1]==='\\'){ var k=src.indexOf('\n',j+1); if(k<0){j=n;break;} j=k; }
        out.push('<span class="pp">'+esc(src.slice(i,j))+'</span>'); i=j; continue; }
      // string
      if(c==='"'){ var j=i+1; while(j<n&&src[j]!=='"'){ if(src[j]==='\\') j++; j++; } j++; out.push('<span class="str">'+esc(src.slice(i,j))+'</span>'); i=j; continue; }
      if(c==="'"){ var j=i+1; while(j<n&&src[j]!=="'"){ if(src[j]==='\\') j++; j++; } j++; out.push('<span class="str">'+esc(src.slice(i,j))+'</span>'); i=j; continue; }
      // number
      if(/[0-9]/.test(c) || (c==='.'&&/[0-9]/.test(src[i+1]))){ var j=i+1; while(j<n && /[0-9a-fA-FxX._]/.test(src[j])) j++; out.push('<span class="num">'+esc(src.slice(i,j))+'</span>'); i=j; continue; }
      // identifier / keyword / type
      if(isId(c)){ var j=i+1; while(j<n&&isId(src[j])) j++; var w=src.slice(i,j);
        if(KWSET[w]) out.push('<span class="kw">'+esc(w)+'</span>');
        else if(/^[A-Z]/.test(w) && w.length>1) out.push('<span class="ty">'+esc(w)+'</span>'); // Capitalized = type-ish
        else { // function call? next non-space is (
          var k=j; while(k<n&&/\s/.test(src[k])) k++;
          if(src[k]==='(') out.push('<span class="fn">'+esc(w)+'</span>');
          else out.push(esc(w));
        }
        i=j; continue; }
      // operators
      if("+-*/%=<>!&|^~?:".indexOf(c)>=0){ var j=i+1; while(j<n&&"+-*/%=<>!&|^~?:".indexOf(src[j])>=0) j++; out.push('<span class="op">'+esc(src.slice(i,j))+'</span>'); i=j; continue; }
      out.push(esc(c)); i++;
    }
    return out.join("");
  }
  function highlight(code, lang){
    lang=(lang||"cpp").toLowerCase();
    if(lang==="cpp"||lang==="c"||lang==="c++"||lang==="cc"||lang==="cpp") return hlCpp(code);
    return esc(code);
  }

  // ===== current problem set by mode/filter =====
  function activeList(){
    var base;
    if(mode==="topic") base = groups[topic] || PROBLEMS;
    else base = PROBLEMS;
    return base.filter(function(p){
      var id=p.id;
      if(filter==="unseen") return !seen.has(id);
      if(filter==="seen") return seen.has(id);
      if(filter==="done") return done.has(id);
      if(filter==="undone") return !done.has(id);
      if(filter==="fav") return fav.has(id);
      return true;
    });
  }

  function markSeen(p){ seen.add(p.id); saveSet(K_SEEN, seen); }

  function renderProgress(){
    document.getElementById("seenN").textContent=seen.size;
    document.getElementById("doneN").textContent=done.size;
    document.getElementById("favN").textContent=fav.size;
    document.getElementById("totalN").textContent=N;
    document.getElementById("totalFoot").textContent=N;
    var pct = N? Math.round(seen.size*100/N):0;
    document.getElementById("barFill").style.width=pct+"%";
  }

  function renderQuestion(){
    var wrap=document.getElementById("qcardWrap");
    var list=activeList();
    if(list.length===0){
      wrap.innerHTML='<div class="qcard"><div class="empty">当前筛选下没有题目。换个筛选或专题试试。</div></div>';
      renderProgress();
      return;
    }
    // ensure curIdx points into active list when possible
    var p = PROBLEMS[curIdx];
    if(!p || list.indexOf(p)<0){ p=list[0]; curIdx=PROBLEMS.indexOf(p); }

    markSeen(p);
    var diffCls=(p.difficulty||"").replace(/\s/g,"");
    var hints = p.hints && p.hints.length ? p.hints : null;
    var hintHTML = hints ? hints.map(function(h,i){
      var lvl = i===0?"很粗糙":(i===1?"中等":"较具体");
      return '<button class="reveal hint" data-h="'+i+'"><span>💡 提示 '+(i+1)+'</span><span class="lvl">('+lvl+')</span><span class="arr">▶</span></button>'+
             '<div class="panel" data-ph="'+i+'"><div class="hint-box">'+esc(h)+'</div></div>';
    }).join("") : '<div style="margin-top:8px;font-size:12px;color:#7c8aa0">（本题暂无分级提示）</div>';

    wrap.innerHTML =
      '<div class="qcard">'+
        '<div class="qhead">'+
          '<span class="qnum">第 '+p._n+' 题</span>'+
          '<span class="qcat">'+esc(p.category)+'</span>'+
          '<span class="qdiff '+esc(diffCls)+'">'+esc(p.difficulty)+'</span>'+
          '<div class="qtitle">'+esc(p.title)+'</div>'+
        '</div>'+
        '<div class="statement">'+esc(p.statement)+'</div>'+
        hintHTML+
        '<button class="reveal" data-r="analysis"><span>📝 查看题解</span><span class="arr">▶</span></button>'+
        '<div class="panel" data-pr="analysis"><div class="analysis">'+esc(p.analysis)+'</div></div>'+
        '<button class="reveal" data-r="code"><span>💻 查看代码</span><span class="arr">▶</span></button>'+
        '<div class="panel" data-pr="code">'+
          '<pre class="code"><code>'+highlight(p.code,p.codeLang)+'</code></pre>'+
          '<div class="code-meta">语言：<b>'+esc(p.codeLang)+'</b> · 代码来源：<b>'+esc(p.codeSource)+'</b> · 题源：'+esc(p.source)+'</div>'+
        '</div>'+
        '<div class="actions">'+
          '<button class="act '+(done.has(p.id)?"on done":"")+'" data-a="done">'+(done.has(p.id)?"✅ 已完成":"标记完成")+'</button>'+
          '<button class="act '+(fav.has(p.id)?"on fav":"")+'" data-a="fav">'+(fav.has(p.id)?"★ 已收藏":"☆ 收藏")+'</button>'+
          '<button class="act reset" data-a="reset">重置</button>'+
        '</div>'+
        '<div class="navrow">'+
          '<button class="navbtn prev" id="prevBtn">← 上一题</button>'+
          '<button class="navbtn seq" id="seqNext">顺序下一题</button>'+
          '<button class="navbtn rand" id="randNext">🎲 随机</button>'+
        '</div>'+
        '<div class="qfooter">编号范围 1–'+N+' · 当前在「'+esc(mode==="topic"?topic:(mode==="rand"?"随机":"顺序"))+'」模式</div>'+
      '</div>';

    // disable prev/seq at bounds for sequential ordering over active list
    var pos=list.indexOf(p);
    document.getElementById("prevBtn").disabled = (mode==="seq"||mode==="topic") && pos<=0;
    document.getElementById("seqNext").disabled = (mode==="seq"||mode==="topic") && pos>=list.length-1;
    renderProgress();
    renderDrawerActive();
  }

  function goto(delta){
    var list=activeList();
    if(list.length===0) return;
    var p=PROBLEMS[curIdx];
    var pos=list.indexOf(p); if(pos<0) pos=0;
    pos=(pos+delta);
    if(pos<0) pos=list.length-1; if(pos>=list.length) pos=0;
    var np=list[pos]; curIdx=PROBLEMS.indexOf(np);
    renderQuestion();
    window.scrollTo({top:0,behavior:"smooth"});
  }
  function gotoRandom(){
    var list=activeList(); if(list.length===0) return;
    if(list.length===1){ curIdx=PROBLEMS.indexOf(list[0]); renderQuestion(); return; }
    var p; do{ p=list[Math.floor(Math.random()*list.length)]; }while(PROBLEMS.indexOf(p)===curIdx && list.length>1);
    curIdx=PROBLEMS.indexOf(p); renderQuestion(); window.scrollTo({top:0,behavior:"smooth"});
  }
  function gotoId(id){ for(var i=0;i<N;i++){ if(PROBLEMS[i].id===id){ curIdx=i; renderQuestion(); window.scrollTo({top:0,behavior:"smooth"}); return; } } }
  function gotoNum(num){ if(num>=1&&num<=N){ curIdx=num-1; renderQuestion(); window.scrollTo({top:0,behavior:"smooth"}); } }

  // ===== sidebar drawer =====
  function renderDrawer(filterStr){
    var body=document.getElementById("drawerBody");
    body.innerHTML="";
    var q=(filterStr||"").trim().toLowerCase();
    var any=false;
    order.forEach(function(cat){
      var items=groups[cat].filter(function(p){
        if(!q) return true;
        return (p.title+" "+p.source+" "+(p.tags||[]).join(" ")+" "+p.category).toLowerCase().indexOf(q)>=0;
      });
      if(items.length===0) return;
      any=true;
      var h=document.createElement("div"); h.className="dcat-h"; h.textContent=cat+"（"+items.length+"）";
      body.appendChild(h);
      items.forEach(function(p){
        var cls = fav.has(p.id)?"fav":(done.has(p.id)?"done":(seen.has(p.id)?"seen":""));
        var row=document.createElement("div"); row.className="ditem"+(PROBLEMS[curIdx]&&PROBLEMS[curIdx].id===p.id?" cur":"");
        row.innerHTML='<span class="di">'+p._n+'</span><span class="ddot '+cls+'"></span><span class="dt">'+esc(p.title)+'</span>'+(fav.has(p.id)?'<span class="dstar">★</span>':'');
        row.addEventListener("click",function(){ gotoId(p.id); closeDrawer(); });
        body.appendChild(row);
      });
    });
    if(!any){ body.innerHTML='<div class="empty">没有匹配的题目</div>'; }
  }
  function renderDrawerActive(){
    var rows=document.getElementById("drawerBody").querySelectorAll(".ditem");
    // re-render is simpler: just refresh classes
    rows.forEach(function(r){ r.classList.remove("cur"); });
    // lightweight: full re-render only if structure changed; here just toggle cur by data-id not stored -> re-render
    renderDrawer(document.getElementById("drawerSearch").value);
  }
  function openDrawer(){ document.getElementById("drawer").classList.add("open"); document.getElementById("drawerBack").classList.add("open"); renderDrawer(document.getElementById("drawerSearch").value); }
  function closeDrawer(){ document.getElementById("drawer").classList.remove("open"); document.getElementById("drawerBack").classList.remove("open"); }

  // ===== topic row =====
  function renderTopicRow(){
    var tr=document.getElementById("topicRow"); tr.innerHTML="";
    order.forEach(function(cat){
      var b=document.createElement("button"); b.className="chip"+(cat===topic?" active":""); b.textContent=cat;
      b.addEventListener("click",function(){ topic=cat; localStorage.setItem(K_TOPIC,topic); renderTopicRow(); renderQuestion(); });
      tr.appendChild(b);
    });
  }
  function renderMode(){
    document.querySelectorAll("#modeRow .chip").forEach(function(c){ c.classList.toggle("active", c.dataset.mode===mode); });
    document.getElementById("topicRow").style.display = mode==="topic"?"flex":"none";
  }

  // ===== events =====
  document.getElementById("qcardWrap").addEventListener("click",function(e){
    var t=e.target.closest("button"); if(!t) return;
    if(t.classList.contains("reveal")){
      // hint vs answer/code
      if(t.classList.contains("hint")){
        var hi=t.dataset.h, panel=t.parentElement.querySelector('.panel[data-ph="'+hi+'"]');
        var open=t.classList.toggle("open"); if(panel) panel.classList.toggle("open",open);
      } else {
        var rk=t.dataset.r, panel=t.parentElement.querySelector('.panel[data-pr="'+rk+'"]');
        var open=t.classList.toggle("open"); if(panel) panel.classList.toggle("open",open);
      }
      return;
    }
    if(t.classList.contains("act")){
      var p=PROBLEMS[curIdx]; var a=t.dataset.a;
      if(a==="done"){ if(done.has(p.id)) done.delete(p.id); else done.add(p.id); saveSet(K_DONE,done); }
      else if(a==="fav"){ if(fav.has(p.id)) fav.delete(p.id); else fav.add(p.id); saveSet(K_FAV,fav); }
      else if(a==="reset"){ seen.delete(p.id); done.delete(p.id); fav.delete(p.id); saveSet(K_SEEN,seen); saveSet(K_DONE,done); saveSet(K_FAV,fav); }
      renderQuestion();
      return;
    }
    if(t.id==="prevBtn"){ goto(-1); return; }
    if(t.id==="seqNext"){ if(mode==="rand") gotoRandom(); else goto(1); return; }
    if(t.id==="randNext"){ gotoRandom(); return; }
  });

  document.getElementById("modeRow").addEventListener("click",function(e){
    var t=e.target.closest(".chip"); if(!t) return;
    mode=t.dataset.mode; localStorage.setItem(K_MODE,mode); renderMode(); renderQuestion();
  });
  document.getElementById("filterRow").addEventListener("click",function(e){
    var t=e.target.closest(".chip"); if(!t) return;
    filter=t.dataset.f;
    this.querySelectorAll(".chip").forEach(function(c){ c.classList.toggle("active",c===t); });
    renderQuestion();
  });
  document.getElementById("jumpBtn").addEventListener("click",function(){
    var v=parseInt(document.getElementById("jumpInput").value,10); if(v) gotoNum(v);
  });
  document.getElementById("jumpInput").addEventListener("keydown",function(e){ if(e.key==="Enter"){ var v=parseInt(this.value,10); if(v) gotoNum(v); } });

  document.getElementById("drawerBtn").addEventListener("click",openDrawer);
  document.getElementById("drawerClose").addEventListener("click",closeDrawer);
  document.getElementById("drawerBack").addEventListener("click",closeDrawer);
  document.getElementById("drawerSearch").addEventListener("input",function(){ renderDrawer(this.value); });

  // keyboard nav
  document.addEventListener("keydown",function(e){
    if(e.target.tagName==="INPUT") return;
    if(e.key==="ArrowRight") goto(1);
    else if(e.key==="ArrowLeft") goto(-1);
    else if(e.key==="r"||e.key==="R") gotoRandom();
  });

  renderTopicRow(); renderMode(); renderQuestion();
})();
</script>
</body>
</html>
