<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 算法岗面试题库 · 知识区（闯关选择题 + 问答浏览）</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    min-height: 100vh; color: #eaeaea;
    display: flex; justify-content: center;
    padding: 0 12px 40px;
  }
  .wrap { width: 100%; max-width: 480px; }
  /* sticky header */
  header.site {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px; margin: 0 -12px;
    background: rgba(15,52,96,.88); backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(79,195,247,.25);
  }
  header.site .brand { font-size: 16px; font-weight: 700; letter-spacing: .3px; }
  header.site .brand span { color: #4fc3f7; }
  header.site .home { font-size: 13px; color: #b8c7d9; text-decoration: none; background: rgba(255,255,255,.08); padding: 6px 12px; border-radius: 16px; }
  header.site .home:active { background: rgba(255,255,255,.16); }

  /* mode switch */
  .tabs { display: flex; gap: 8px; margin: 16px 0 14px; }
  .tab {
    flex: 1; text-align: center; padding: 10px 6px;
    background: rgba(255,255,255,.06); border: 1.5px solid rgba(255,255,255,.14);
    border-radius: 10px; font-size: 14px; font-weight: 600; color: #c5d2e3;
    cursor: pointer; transition: all .15s;
  }
  .tab.active { background: rgba(79,195,247,.16); border-color: #4fc3f7; color: #fff; }

  /* ===== shared card ===== */
  .card {
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
    border-radius: 14px; padding: 18px 16px;
  }

  /* ===== MCQ ===== */
  #quiz .score { font-size: 14px; background: rgba(255,255,255,.08); padding: 6px 12px; border-radius: 20px; }
  .bar { height: 6px; background: rgba(255,255,255,.12); border-radius: 3px; overflow: hidden; margin-bottom: 16px; }
  #progress { height: 100%; width: 0; background: linear-gradient(90deg, #4fc3f7, #00e5ff); transition: width .3s; }
  .meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 6px; }
  #cat { font-size: 12px; color: #4fc3f7; background: rgba(79,195,247,.12); padding: 3px 10px; border-radius: 12px; }
  #counter { font-size: 12px; color: #9aa7b8; }
  #qtext { font-size: 16px; line-height: 1.6; margin-bottom: 16px; font-weight: 500; }
  .opts { display: flex; flex-direction: column; gap: 9px; }
  .opt {
    display: flex; align-items: flex-start; gap: 10px; width: 100%; text-align: left;
    background: rgba(255,255,255,.07); border: 1.5px solid rgba(255,255,255,.15);
    border-radius: 10px; padding: 11px 13px; font-size: 14.5px; color: #eaeaea;
    cursor: pointer; transition: all .15s; line-height: 1.5;
  }
  .opt:hover { background: rgba(255,255,255,.13); border-color: #4fc3f7; }
  .opt .letter { flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%; background: rgba(255,255,255,.12); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; }
  .opt .txt { flex: 1; }
  .opt input[type=checkbox] { margin-top: 4px; accent-color: #4fc3f7; }
  .opt.right { background: rgba(76,175,80,.18); border-color: #66bb6a; }
  .opt.right .letter { background: #66bb6a; color: #fff; }
  .opt.wrong { background: rgba(244,67,54,.16); border-color: #ef5350; }
  .opt.wrong .letter { background: #ef5350; color: #fff; }
  .opt:disabled, .opt.locked { cursor: default; }
  #submitMulti { margin-top: 14px; width: 100%; padding: 12px; background: #4fc3f7; color: #10233a; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; }
  #submitMulti:hover { background: #81d4fa; }
  #feedback { margin-top: 16px; padding: 14px 16px; border-radius: 10px; font-size: 14.5px; line-height: 1.7; display: none; }
  #feedback.show { display: block; }
  #feedback.ok { background: rgba(76,175,80,.14); border: 1px solid rgba(102,187,106,.5); }
  #feedback.no { background: rgba(244,67,54,.12); border: 1px solid rgba(239,83,80,.5); }
  #feedback .fb-title { font-weight: 700; font-size: 15px; margin-bottom: 6px; }
  #feedback .exp { color: #cfe3f5; }
  #feedback .exp b { color: #fff; }
  #feedback .src { display: block; margin-top: 8px; font-size: 12px; color: #8fa3bd; }
  .btn-next { margin-top: 16px; width: 100%; padding: 13px; background: linear-gradient(90deg, #4fc3f7, #00bcd4); color: #0b1e33; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; display: none; }
  .btn-next:hover { filter: brightness(1.08); }
  .final { text-align: center; padding: 20px 6px; }
  .final .big { font-size: 48px; margin-bottom: 8px; }
  .final h2 { font-size: 21px; margin-bottom: 10px; }
  .final .stat { font-size: 15px; color: #b8c7d9; margin-bottom: 6px; }
  .final .again { margin-top: 16px; display: inline-block; padding: 11px 22px; background: #4fc3f7; color: #0b1e33; border: none; border-radius: 10px; font-size: 14.5px; font-weight: 700; cursor: pointer; }
  .final .again.ghost { background: rgba(255,255,255,.1); color: #eaeaea; margin-left: 8px; }
  .final .again:hover { filter: brightness(1.1); }

  /* ===== Q&A ===== */
  .qbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .chip { font-size: 12.5px; padding: 6px 12px; border-radius: 16px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14); color: #c5d2e3; cursor: pointer; white-space: nowrap; }
  .chip.active { background: rgba(79,195,247,.16); border-color: #4fc3f7; color: #fff; }
  .stats { font-size: 12px; color: #9aa7b8; margin-bottom: 12px; padding: 0 2px; }
  .qcard { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12); border-radius: 12px; padding: 14px 14px; margin-bottom: 10px; }
  .qcard .qhead { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
  .qcard .qhead .chev { flex-shrink: 0; color: #4fc3f7; font-size: 13px; margin-top: 2px; transition: transform .2s; }
  .qcard.open .qhead .chev { transform: rotate(90deg); }
  .qcard .qtitle { flex: 1; font-size: 15px; line-height: 1.55; font-weight: 600; }
  .qcard .qcat { font-size: 11px; color: #4fc3f7; display: block; margin-bottom: 4px; }
  .qcard .qbody { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,.1); font-size: 14px; line-height: 1.7; color: #d3dee9; }
  .qcard.open .qbody { display: block; }
  .qcard .qbody .row { margin-bottom: 9px; }
  .qcard .qbody .row .lbl { color: #4fc3f7; font-weight: 700; margin-right: 4px; }
  .qcard .qbody .src { font-size: 12px; color: #8fa3bd; margin-top: 2px; }
  .qcard .marks { display: flex; gap: 8px; margin-top: 12px; }
  .qcard .mk { flex: 1; padding: 8px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06); color: #c5d2e3; text-align: center; }
  .qcard .mk.on.yes { background: rgba(76,175,80,.2); border-color: #66bb6a; color: #c8f7d0; }
  .qcard .mk.on.no { background: rgba(255,152,0,.18); border-color: #ffb74d; color: #ffe0b2; }
  .empty { text-align: center; color: #8fa3bd; font-size: 14px; padding: 30px 0; }
  footer { text-align: center; font-size: 12px; color: #7c8aa0; margin-top: 18px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap" id="top">
  <header class="site">
    <div class="brand">🎯 AI 算法岗面试题库 <span>· 知识区</span></div>
    <a class="home" href="#top" id="homeBtn">↑ 返回首页</a>
  </header>

  <div class="tabs">
    <div class="tab active" id="tabQuiz">📝 闯关选择题</div>
    <div class="tab" id="tabQA">📚 问答浏览</div>
  </div>

  <!-- ============ MCQ ============ -->
  <section id="quiz">
    <div class="meta" style="margin-bottom:10px">
      <span class="score" id="score">答对 0 / 0</span>
      <span id="counter"></span>
    </div>
    <div class="bar"><div id="progress"></div></div>
    <div class="card">
      <div class="meta">
        <span id="cat"></span>
        <span id="qcount"></span>
      </div>
      <div id="qtext"></div>
      <div class="opts" id="opts"></div>
      <button id="submitMulti" style="display:none">提交答案</button>
      <div id="feedback"></div>
      <button class="btn-next" id="next">下一题 ➜</button>
    </div>
    <footer>共 <b id="totalN">0</b> 题 · 选完即判 · 附解析与来源 · 支持随机重练</footer>
  </section>

  <!-- ============ Q&A ============ -->
  <section id="qa" style="display:none">
    <div class="qbar" id="catBar"></div>
    <div class="qbar" id="memBar">
      <div class="chip active" data-mem="all">全部</div>
      <div class="chip" data-mem="yes">✅ 已记住</div>
      <div class="chip" data-mem="no">🧡 未记住</div>
      <div class="chip" data-mem="none">⚪ 未标记</div>
    </div>
    <div class="stats" id="qaStats"></div>
    <div id="qaList"></div>
    <footer>点击题目展开考察点与参考思路 · 两档记忆标记本地保存 · 可按状态筛选复习</footer>
  </section>
</div>

<script>
"use strict";
/* =====================================================================
   MCQ 数据：移植 THIN-1 35 题并扩充至约 60 题。
   字段：cat 分类 / multi 是否多选 / q 题干 / opts 选项 / ans 正确下标 / exp 解析 / src 来源标注
   ===================================================================== */
const QUESTIONS = [
  // ===== 机器学习 =====
  { cat:"机器学习", multi:false, q:"以下哪个算法属于无监督学习？",
    opts:["逻辑回归","XGBoost","KMeans 聚类","支持向量机"], ans:[2],
    exp:"KMeans 在无标签数据上做聚类，属于无监督学习；逻辑回归、XGBoost、SVM 都需要标签，是有监督学习。",
    src:"某头部厂商真题 · 某头部厂商 ICT 认证 AI 题库原题变体" },
  { cat:"机器学习", multi:false, q:"以下哪种激活函数可能导致“神经元死亡”（dying ReLU）？",
    opts:["Sigmoid","Tanh","ReLU","Softmax"], ans:[2],
    exp:"ReLU 在负区间梯度恒为 0，若神经元长期输入为负，更新后无法恢复激活；LeakyReLU / PReLU 可缓解。",
    src:"某头部厂商真题 · 某头部厂商算法面经" },
  { cat:"机器学习", multi:false, q:"以下哪种做法不能缓解模型过拟合？",
    opts:["增加训练数据","L2 正则化","增加网络层数与参数","Dropout"], ans:[2],
    exp:"增加模型复杂度会加剧过拟合；增加数据、正则化、Dropout 均为常见防过拟合手段。",
    src:"【自出】· 常见考点" },
  { cat:"机器学习", multi:false, q:"Transformer 的 Self-Attention 中，QKᵀ 除以 √d_k 的主要目的是？",
    opts:["加快矩阵乘法","防止点积方差随维度增大导致 softmax 梯度饱和","减少参数量","引入位置信息"], ans:[1],
    exp:"维度 d_k 越大，点积方差越大，softmax 越容易进入饱和区、梯度趋近 0；除以 √d_k 使方差稳定在 1 附近。",
    src:"其他大厂 · 字节/阿里 LLM 岗高频" },
  { cat:"机器学习", multi:false, q:"同时兼顾查准率（Precision）与查全率（Recall）的指标是？",
    opts:["Accuracy","F1 Score","均方误差","交叉熵"], ans:[1],
    exp:"F1 是 Precision 与 Recall 的调和平均；Accuracy 在类别不平衡时失真，MSE / 交叉熵是损失函数。",
    src:"某头部厂商真题 · 某头部厂商算法面经（原题提及 F1）" },
  { cat:"机器学习", multi:false, q:"L2 正则化等价于哪种先验分布下的 MAP 估计？",
    opts:["均匀分布","高斯分布","拉普拉斯分布","伯努利分布"], ans:[1],
    exp:"对高斯先验取负对数得到 L2 惩罚项；拉普拉斯先验对应 L1（产生稀疏解）。",
    src:"其他大厂 · 高频（天池 BAT 宝典）" },
  { cat:"机器学习", multi:false, q:"逻辑回归（LR）输出值的含义是？",
    opts:["类别的硬预测","样本属于正类的概率（经 sigmoid 映射）","支持向量的个数","特征重要性"], ans:[1],
    exp:"LR 将特征的线性组合经 sigmoid 映射到 (0,1)，可解释为属于正类的概率，再按阈值得到类别。",
    src:"某头部厂商真题 · 某头部厂商算法面经" },
  { cat:"机器学习", multi:false, q:"以下哪个是判别式模型（Discriminative Model）？",
    opts:["朴素贝叶斯","隐马尔可夫模型（HMM）","条件随机场（CRF）","高斯混合模型（GMM）"], ans:[2],
    exp:"CRF 直接建模条件概率 P(Y|X)，是判别式模型；朴素贝叶斯、HMM、GMM 建模联合分布 P(X,Y)，为生成式模型。",
    src:"其他大厂 · 阿里/头条高频" },
  { cat:"机器学习", multi:true, q:"【多选】缓解深度网络梯度消失的方法包括？",
    opts:["ReLU 系激活函数","残差连接（ResNet）","BatchNorm","增大学习率"], ans:[0,1,2],
    exp:"ReLU 正区间导数恒 1；残差连接让梯度经恒等捷径直传；BatchNorm 稳定激活分布。增大学习率反而可能不收敛。",
    src:"其他大厂 · 高频" },
  { cat:"机器学习", multi:true, q:"【多选】以下属于正则化 / 防过拟合手段的有？",
    opts:["L1/L2 正则","Dropout","早停（Early Stopping）","数据增强"], ans:[0,1,2,3],
    exp:"四项都能抑制过拟合：L1/L2 限制参数范数，Dropout 随机丢弃神经元，早停据验证集提前停止，数据增强扩充分布。",
    src:"其他大厂 · 高频" },
  { cat:"机器学习", multi:true, q:"【多选】XGBoost 相比传统 GBDT 的改进包括？",
    opts:["对损失做二阶泰勒展开","目标函数显式加正则项","支持行 / 列采样","自动学习缺失值处理方向"], ans:[0,1,2,3],
    exp:"四项均为 XGBoost 相对 GBDT 的典型改进，带来更高精度、更强防过拟合与训练效率。",
    src:"其他大厂 · 字节/腾讯/阿里高频" },
  { cat:"机器学习", multi:true, q:"【多选】以下属于生成式模型的有？",
    opts:["朴素贝叶斯","GAN","HMM","逻辑回归"], ans:[0,1,2],
    exp:"生成式模型建模联合分布 / 数据生成过程；逻辑回归建模条件概率，是判别式模型。",
    src:"【自出】· 常见考点" },
  { cat:"机器学习", multi:false, q:"以下哪些算法通常不需要对特征做归一化？",
    opts:["SVM","KNN","决策树 / GBDT","逻辑回归"], ans:[2],
    exp:"树模型按特征值分裂，对单调变换与量纲不敏感，无需归一化；基于距离/梯度的模型（SVM、KNN、LR、神经网络）需要。",
    src:"其他大厂 · 百度机器学习岗" },
  { cat:"机器学习", multi:false, q:"偏差（Bias）与方差（Variance）的关系，正确的是？",
    opts:["偏差大表示模型过拟合","方差大表示模型太简单欠拟合","bagging 主要降偏差、boosting 主要降方差","bagging 主要降方差、boosting 主要降偏差"], ans:[3],
    exp:"偏差大＝欠拟合（模型太简单）；方差大＝过拟合（模型太复杂）。bagging 多模型平均降方差，boosting 逐步纠正降偏差。",
    src:"其他大厂 · 百度/腾讯/美团高频" },
  { cat:"机器学习", multi:false, q:"AUC 衡量的是模型的什么能力？",
    opts:["预测概率的绝对准确性","正负样本的排序能力，对阈值不敏感","训练集上的准确率","模型参数量"], ans:[1],
    exp:"AUC 是 ROC 曲线下面积，衡量正样本排在负样本前面的概率，只看排序、对决策阈值不敏感，适合不平衡场景。",
    src:"某头部厂商真题 · 某头部厂商算法面经（查准率/查全率/AUC 同题）" },
  { cat:"机器学习", multi:false, q:"朴素贝叶斯之所以“朴素”，是因为？",
    opts:["模型过于简单所以效果差","假设特征在给定类别下条件独立","只用一阶特征","不需要训练数据"], ans:[1],
    exp:"朴素贝叶斯假设特征在给定标签下条件独立，现实常不成立但效果尚可；适合高维稀疏文本分类，需拉普拉斯平滑防零概率。",
    src:"【自出】· 常见考点" },
  { cat:"机器学习", multi:false, q:"为什么分类任务常用交叉熵损失而不是 MSE？",
    opts:["MSE 计算量太大","交叉熵配 softmax 梯度简洁（ŷ−y）、收敛快，MSE 配 sigmoid 两端梯度饱和","交叉熵不需要标签","MSE 只能用于回归"], ans:[1],
    exp:"softmax+交叉熵求导为 ŷ−y，梯度与误差成正比；MSE 配 sigmoid/softmax 在两端饱和区梯度趋 0，收敛慢。",
    src:"某头部厂商真题 · 某头部厂商算法面经（“讲一下 softmax”）" },

  // ===== 深度学习 =====
  { cat:"深度学习", multi:false, q:"池化层（Pooling）的主要作用不包括？",
    opts:["降低特征图尺寸与计算量","扩大感受野","引入非线性变换","提供平移 / 尺度不变性"], ans:[2],
    exp:"池化是固定统计操作（取 max 或均值），不含可学习参数、本身不引入非线性；引入非线性靠激活函数。",
    src:"某头部厂商真题 · 某头部厂商算法面经" },
  { cat:"深度学习", multi:false, q:"CNN 中 1×1 卷积核的作用是？",
    opts:["扩大感受野","通道维变换（升 / 降维）并减少参数量","代替池化","防止过拟合"], ans:[1],
    exp:"1×1 卷积对通道做线性组合实现升 / 降维并显著降低计算量；扩大感受野靠更大卷积核、空洞卷积或加深网络。",
    src:"某头部厂商真题 · 某头部厂商算法面经" },
  { cat:"深度学习", multi:false, q:"关于 max 池化的反向传播，说法正确的是？",
    opts:["梯度平均分配给所有输入","池化层没有梯度","梯度只回传给最大值位置，其余为 0","梯度全部给最小值位置"], ans:[2],
    exp:"max 池化 forward 时记录最大值位置，backward 把上游梯度原样回传给该位置，其余位置为 0；平均池化则均分。",
    src:"某头部厂商真题 · 某头部厂商算法面经（卷积反传同题）" },
  { cat:"深度学习", multi:false, q:"Softmax 输出的特性是？",
    opts:["输出一定是 0 或 1","所有输出之和为 1","可以出现负数","与输入顺序无关"], ans:[1],

/* ================= MCQ 应用逻辑 ================= */
const $q = id => document.getElementById(id);
const LETTERS = ["A","B","C","D"];
document.getElementById("totalN").textContent = QUESTIONS.length;

function shuffle(arr){ for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];} return arr; }

const savedOrder = (() => { try { const s = localStorage.getItem("aiQuizOrder"); return s ? JSON.parse(s) : null; } catch(e){ return null; } });
let order = (() => { const s = savedOrder(); return (s && s.length === QUESTIONS.length) ? s : QUESTIONS.map((_,i)=>i); })();
let idx = 0, score = 0, answered = false;

function renderQuiz(){
  answered = false;
  const q = QUESTIONS[order[idx]];
  $q("progress").style.width = (idx / QUESTIONS.length * 100) + "%";
  $q("counter").textContent = "第 " + (idx+1) + " / " + QUESTIONS.length + " 题";
  $q("qcount").textContent = "";
  $q("cat").textContent = q.cat + (q.multi ? " · 多选" : " · 单选");
  $q("qtext").textContent = q.q;
  const list = $q("opts"); list.innerHTML = "";
  q.opts.forEach((opt,i)=>{
    if(q.multi){
      const label = document.createElement("label"); label.className="opt";
      label.innerHTML = '<input type="checkbox" value="'+i+'"><span class="letter">'+LETTERS[i]+'</span><span class="txt">'+opt+"</span>";
      list.appendChild(label);
    } else {
      const btn = document.createElement("button"); btn.className="opt";
      btn.innerHTML = '<span class="letter">'+LETTERS[i]+'</span><span class="txt">'+opt+"</span>";
      btn.onclick = ()=>submitSingle(i); list.appendChild(btn);
    }
  });
  $q("submitMulti").style.display = q.multi ? "block" : "none";
  $q("feedback").className=""; $q("feedback").innerHTML="";
  $q("next").style.display="none";
  $q("score").textContent = "答对 " + score + " / " + idx;
}
function showFeedback(ok,title,expHtml){
  const fb=$q("feedback"); fb.className="show "+(ok?"ok":"no");
  fb.innerHTML='<div class="fb-title">'+title+'</div><div class="exp">'+expHtml+'</div>';
}
function submitSingle(i){
  if(answered) return; answered=true;
  const q=QUESTIONS[order[idx]]; const btns=$q("opts").querySelectorAll(".opt");
  btns.forEach((b,j)=>{ b.classList.add("locked"); if(j===q.ans[0]) b.classList.add("right"); if(j===i && i!==q.ans[0]) b.classList.add("wrong"); });
  const ok = i===q.ans[0]; if(ok) score++;
  showFeedback(ok, ok?"✅ 回答正确！":"❌ 回答错误。", '<b>正确答案：'+LETTERS[q.ans[0]]+'</b>　'+q.exp + '<span class="src">来源：'+q.src+'</span>');
  $q("next").style.display="block";
  $q("score").textContent = "答对 " + score + " / " + (idx+1);
}
function submitMulti(){
  if(answered) return; answered=true;
  const q=QUESTIONS[order[idx]]; const boxes=$q("opts").querySelectorAll("input[type=checkbox]");
  const sel=[]; boxes.forEach((b,j)=>{ if(b.checked) sel.push(j); b.disabled=true; });
  const ans=q.ans.slice().sort().join(","), mine=sel.slice().sort().join(","); const ok = ans===mine; if(ok) score++;
  const btns=$q("opts").querySelectorAll(".opt");
  btns.forEach((b,j)=>{ if(q.ans.includes(j)) b.classList.add("right"); else if(b.querySelector("input").checked) b.classList.add("wrong"); });
  const rightLetters=q.ans.map(j=>LETTERS[j]).join("、");
  showFeedback(ok, ok?"✅ 回答正确！":"❌ 回答错误。", '<b>正确答案：'+rightLetters+'</b>　'+q.exp + '<span class="src">来源：'+q.src+'</span>');
  $q("submitMulti").style.display="none"; $q("next").style.display="block";
  $q("score").textContent = "答对 " + score + " / " + (idx+1);
}
$q("submitMulti").onclick = submitMulti;
$q("next").onclick = ()=>{ idx++; if(idx>=QUESTIONS.length) showFinal(); else renderQuiz(); };
function showFinal(){
  const pct=Math.round(score/QUESTIONS.length*100);
  const msg = pct===100?"满分！直接去面试吧 🎉": pct>=80?"非常扎实，保持状态 🚀": pct>=60?"基础不错，把错题解析再过一遍 💪":"重点复习错题解析，再来一轮 📖";
  const card=document.querySelector("#quiz .card");
  card.innerHTML='<div class="final"><div class="big">'+(pct>=60?"🎉":"📖")+'</div>'
    +'<h2>本轮完成！</h2>'
    +'<div class="stat">答对 <b>'+score+'</b> / '+QUESTIONS.length+' 题（'+pct+'%）</div>'
    +'<div class="stat">'+msg+'</div>'
    +'<button class="again" onclick="restartQuiz(false)">🔄 再练一次（原顺序）</button>'
    +'<button class="again ghost" onclick="restartQuiz(true)">🔀 随机顺序重练</button></div>';
  $q("progress").style.width="100%";
  $q("score").textContent = "答对 " + score + " / " + QUESTIONS.length;
}
function restartQuiz(random){
  if(random){ const o=QUESTIONS.map((_,i)=>i); shuffle(o); localStorage.setItem("aiQuizOrder",JSON.stringify(o)); }
  else { localStorage.removeItem("aiQuizOrder"); }
  location.reload();
}
document.addEventListener("keydown",(e)=>{
  if(document.getElementById("quiz").style.display==="none") return;
  if(answered || QUESTIONS[order[idx]].multi) return;
  const j=["A","B","C","D"].indexOf(e.key.toUpperCase());
  if(j>=0){ const btns=$q("opts").querySelectorAll(".opt"); if(btns[j]) btns[j].click(); }
});

  {cat:"深度学习",q:"为什么会出现梯度消失和梯度爆炸？怎么解决？",point:"深度网络训练稳定性（某头部厂商必考）",
   ans:"反向传播连乘导致：层数深、激活导数在 (0,1) 且权重小→梯度消失；权重/导数>1 指数放大→梯度爆炸。解决：合理初始化（Xavier/He）、BN、残差连接、ReLU 系激活、梯度裁剪（爆炸）、LSTM 门控。区分前馈网络与 RNN 的梯度消失机理（时间步雅可比连乘）。",
   src:"某头部厂商真题 · 某头部厂商 AI 工程师一面（牛客面经）；字节三面同类题"},
  {cat:"深度学习",q:"CNN 中 1×1 卷积核的作用？",point:"CNN 基础",
   ans:"通道维度的线性组合，可升维/降维；减少参数量和计算量；引入非线性（后接激活）；替代全连接层（NIN/GoogLeNet）；实现跨通道信息融合。",
   src:"某头部厂商真题 · 某头部厂商算法面经（“1×1 卷积核的作用”）"},
  {cat:"深度学习",q:"卷积层怎么反向传播？介绍一个你熟悉的 CNN 网络",point:"CNN 原理深度",
   ans:"链式法则：对输入的梯度＝输出梯度与旋转 180° 的卷积核做卷积（im2col 视角更直观）；对权重的梯度＝输入与输出梯度的相关。熟悉模型可讲 ResNet：残差块、瓶颈结构、解决退化/梯度消失。",
   src:"某头部厂商真题 · 某头部厂商算法面经（“卷积怎么反向传播”）"},
  {cat:"深度学习",q:"什么是感受野？池化层的作用？",point:"CNN 概念",
   ans:"感受野＝输出特征图某点对应输入图像的区域大小，越大上下文越多。扩大感受野：加深网络、空洞卷积、增大卷积核。池化：降维降计算量、扩大感受野、提供平移/尺度不变性、防过拟合。池化反传：max 给最大值位置，平均均分。",
   src:"某头部厂商真题 · 某头部厂商算法面经（“什么是感受野”“池化层的作用”）"},
  {cat:"深度学习",q:"空洞卷积相比普通卷积有何不同？特征图很小时怎么处理？",point:"CNN 变体",
   ans:"空洞卷积不增加参数/计算量而指数扩大感受野，常用于语义分割（DeepLab）。缺点：网格效应、局部信息连续性受损。特征图很小、加 padding 引入太多无效信息时：改用普通卷积堆叠、上采样后再卷积、或减小空洞率。",
   src:"某头部厂商真题 · 某头部厂商算法面经（含追问）"},
  {cat:"深度学习",q:"常见激活函数及区别？为什么 ReLU 系成为主流？",point:"激活函数",
   ans:"sigmoid/tanh：饱和区梯度消失，sigmoid 输出非零中心。ReLU：计算快、正区间梯度恒 1 缓解消失、稀疏激活，但负区间神经元死亡。改进：LeakyReLU/PReLU/ELU/Swish/GELU。输出层按任务：二分类 sigmoid、多分类 softmax、回归线性。",
   src:"其他大厂 · 腾讯/字节高频"},
  {cat:"深度学习",q:"BatchNorm 的工作过程？训练和推理有什么区别？为什么能加速收敛/抑制过拟合？",point:"归一化",
   ans:"对每个 batch 在通道维求均值方差→归一化→学习缩放平移参数 γ、β。训练用 batch 统计量，推理用滑动平均的全局统计量。加速收敛：缓解内部协变量偏移、平滑损失曲面、允许更大学习率。有轻微正则化效果（batch 统计量噪声），小 batch 效果变差。",
   src:"其他大厂 · 字节/腾讯高频"},
  {cat:"深度学习",q:"残差网络（ResNet）为什么能解决梯度消失和网络退化？",point:"网络结构",
   ans:"残差块输出 y=F(x)+x，恒等映射使梯度经捷径直传，连乘变求和，缓解梯度消失。退化问题：深层至少能学成恒等映射，不会比浅层差。实践上让上百层网络可训练。",
   src:"其他大厂 · 腾讯/阿里高频"},
  {cat:"深度学习",q:"LSTM 为什么能缓解 RNN 的梯度消失/爆炸？讲一下三个门",point:"序列模型",
   ans:"RNN 梯度消失源于时间步雅可比矩阵连乘导致梯度指数衰减。LSTM 引入细胞状态 C 与门控：遗忘门 f、输入门 i、输出门 o，通过加性更新让梯度沿细胞状态直线传播，缓解消失。遗忘门控制历史信息保留，输入门控制新信息写入，输出门控制读出。",
   src:"其他大厂 · 腾讯/头条高频"},
  {cat:"深度学习",q:"常见优化器对比：SGD / Momentum / RMSProp / Adam",point:"优化器",
   ans:"SGD 简单但收敛慢、易震荡。Momentum 累积历史梯度方向加速、抑制震荡。RMSProp/Adagrad 按参数自适应学习率。Adam=动量+自适应学习率，收敛快、超参鲁棒，但泛化有时不如调好的 SGD+Momentum。大模型训练常见 AdamW（解耦权重衰减）。",
   src:"其他大厂 · 字节/腾讯高频"},
  {cat:"深度学习",q:"手撕：卷积/池化/BN 的 forward 与 backward（以 max pooling 为例）",point:"手撕底层实现",
   ans:"max pooling forward：双循环取窗口最大值并记录索引；backward：把上游梯度放回最大值位置，其余为 0。卷积 forward 可用 im2col+矩阵乘实现。边界条件（padding/stride）要处理对。先讲思路再写码，注意代码规范。",
   src:"其他大厂 · 字节/CV 岗高频"},
  {cat:"深度学习",q:"【自出】PyTorch 和 TensorFlow 的区别？Numpy 数组和 PyTorch Tensor 的区别？",point:"框架基础",
   ans:"PyTorch 动态图、调试友好、生态主流；TF 静态图/2.x 动态图、生产部署工具链全。Tensor 支持 GPU 加速、自动求导（requires_grad）、图构建，Numpy 纯 CPU 计算无自动求导。某头部厂商体系可能追问 自研 AI 框架：端云统一、动静统一、自动并行，与自研 AI 芯片深度协同。",
   src:"某头部厂商真题（变形）· 某头部厂商算法面经原题 + 【自出】补充 自研 AI 框架"},

  // 三、大模型 LLM
  {cat:"大模型",q:"详述 Transformer 的 Self-Attention：Q/K/V 是什么？为什么除以 √d_k？多头注意力的意义？",point:"Transformer 原理（必考）",
   ans:"输入经三个线性投影得 Q/K/V，注意力权重=softmax(QKᵀ/√d_k)V。除以 √d_k 防止点积随维度增大而方差过大、softmax 落入饱和区梯度消失。多头让模型在不同子空间捕获不同类型依赖，类似多个视角。相比 RNN/CNN 能直接建模长距离依赖，但复杂度 O(n²)。",
   src:"其他大厂 · 字节/阿里/DeepSeek LLM 岗高频"},
  {cat:"大模型",q:"位置编码的作用？讲一下 RoPE 和 ALiBi",point:"位置编码（LLM 岗 100% 会问）",
   ans:"Transformer 无位置信息，需注入位置编码。绝对位置编码（sinusoidal/可学习）。RoPE：用旋转矩阵把相对位置信息编码进 Q/K 的点积，外推性更好，LLaMA 系在用。ALiBi：给注意力分数加与距离线性相关的偏置，无需训练即可外推长文本。",
   src:"其他大厂 · 字节/阿里/快手高频"},
  {cat:"大模型",q:"BPE（Byte Pair Encoding）分词原理？中文分词注意什么？",point:"Tokenization",
   ans:"初始为字符/字节，反复合并频次最高的相邻 pair 直到词表大小达标。优点：平衡词表大小与 OOV。中文：字/子词切分粒度、预分词策略、词表覆盖常用字与词。可追问：为什么 GPT 用 BPE，SentencePiece 与 BPE 区别（无监督、Unigram 语言模型）。",
   src:"其他大厂 · LLM 岗高频"},
  {cat:"大模型",q:"Pre-train、SFT、RLHF 的区别？为什么 SFT 之后还要 RL？",point:"训练流程与对齐",
   ans:"预训练：海量文本学语言能力（next token prediction）；SFT：指令数据学“按指令回答”；RLHF：偏好数据对齐人类价值观、提升有用性/无害性。只做 SFT 的局限：难以表达复杂偏好（“更好”是相对概念）、只能模仿标注分布、无法优化多轮/开放式目标。RLHF 直接以偏好反馈为目标优化。",
   src:"其他大厂 · 字节/阿里/DeepSeek 高频"},
  {cat:"大模型",q:"RLHF 三阶段流程是什么？奖励模型怎么训练（Bradley-Terry）？为什么用 PPO？",point:"RLHF 深度",
   ans:"三阶段：SFT → 训练奖励模型 RM（成对比较数据，损失≈log σ(r_x−r_y) 的 Bradley-Terry 排序损失）→ PPO 强化学习微调。用成对比较而非绝对分数：标注者更易做相对判断、方差小。用 PPO：裁剪目标稳定策略更新、KL 惩罚防止模型偏离原分布（奖励黑客）。β 过小漂移，过大对齐不足。",
   src:"其他大厂 · 字节/阿里/DeepSeek 高频"},
  {cat:"大模型",q:"SFT、RLHF、DPO 的对比？DPO 的核心思想？",point:"对齐技术选型",
   ans:"SFT 成本低但上限有限；RLHF 效果好但流程复杂、训练不稳定（需 RM+PPO 两套模型）。DPO：把 RL 目标改写为直接基于偏好对的分类损失，无需显式 RM 和 RL 训练，简单稳定。局限：无 RM 的额外信号、对偏好数据质量敏感。实际常 SFT→DPO/RLHF 组合。",
   src:"其他大厂 · 高频"},
  {cat:"大模型",q:"详细说下 RAG 的流程？如何缓解幻觉？",point:"RAG（应用岗必考）",
   ans:"流程：文档切块(chunk)→embedding→向量库存储；查询时 query embedding 检索 top-k→重排(rerank)→拼进 prompt→LLM 生成，答案带引用。切块策略、相似度函数（余弦）、rerank 必要性。缓解幻觉：检索质量（分块/embedding/rerank）、限定知识源、提示词约束、答案引用校验、模型评估闭环。与微调：RAG 适合知识更新频繁，微调适合风格/能力。",
   src:"其他大厂 · 高频"},
  {cat:"大模型",q:"什么是 Agent？ReAct 框架原理？Function Calling 和 MCP 是什么？",point:"Agent（2025-2026 高频）",
   ans:"Agent=LLM+规划+工具+记忆+执行闭环，Workflow 是固定 DAG、Agent 由模型动态决策。ReAct：推理(Thought)→行动(Action)→观察(Observation)循环交替。Function Calling：模型输出结构化调用指令选择工具；MCP 是标准化工具/资源协议，解决工具接入碎片化。常追问：多 Agent 协作、记忆管理、幻觉与工具失败兜底。",
   src:"其他大厂 · 字节 Agent 开发岗高频"},
  {cat:"大模型",q:"推理加速：KV Cache 原理？FlashAttention 优化了什么？vLLM 的 PagedAttention？",point:"推理优化（面 LLM 公司必问）",
   ans:"KV Cache：解码阶段缓存历史 token 的 K/V，避免重复计算，代价是显存随序列线性增长。FlashAttention：分块计算注意力避免实例化完整注意力矩阵，IO 优化+tiling，显存 O(n) 且更快。PagedAttention：把 KV cache 分页管理，类似虚拟内存，减少碎片、提高批处理吞吐。追问：MQA/GQA 共享 KV 头降显存。",
   src:"其他大厂 · 字节/阿里/DeepSeek 高频"},
  {cat:"大模型",q:"LoRA 原理及参数量计算？全参数微调、LoRA、QLoRA 区别？",point:"高效微调",
   ans:"LoRA：冻结原权重 W，只训练低秩分解 A·B（ΔW=BA，rank r），推理时合并回 W。参数量：2×d×r，远小于全量。全参微调效果上限高但显存/成本大；QLoRA 对冻结权重 4bit 量化进一步省显存。选择逻辑：数据量、GPU 内存、效果要求。",
   src:"其他大厂 · 高频"},
  {cat:"大模型",q:"大模型一张卡放不下，有哪些并行策略？DeepSpeed ZeRO 做了什么？",point:"分布式训练",
   ans:"数据并行（DP/ZeRO-DP）：各卡一份模型、分数据。张量并行（TP）：层内切分矩阵。流水线并行（PP）：按层切分、微批次流水。混合专家（MoE）专家并行。ZeRO：把优化器状态/梯度/参数分片，三级 ZeRO-1/2/3，用通信换显存。某头部厂商可补充：自研 AI 芯片 自研集合通信库 通信、自研 AI 框架 自动并行。",
   src:"其他大厂 · 高频 + 某头部厂商自研芯片岗相关"},
  {cat:"大模型",q:"【自出】LLM 幻觉产生的原因？有哪些检测与缓解手段？",point:"LLM 可靠性（开放题）",
   ans:"原因：训练目标是 token 概率而非事实、知识截止、解码采样随机、缺乏外部知识约束。缓解：RAG 外挂知识、提示词约束（“不知道就说不知道”）、解码参数调低温度、事实核对（搜索/工具验证）、对置信度低拒答。检测：自我一致性、外部检索校验、NLI 式核对。",
   src:"【自出】· 某头部厂商大模型/应用岗常见开放题"},

  // 四、CV 与 NLP
  {cat:"CV与NLP",q:"图像数据增强的方法有哪些？（图像/音频）",point:"数据增强（某头部厂商原题）",
   ans:"图像：翻转、旋转、裁剪、缩放、平移、加噪声、色彩抖动、亮度对比度调整、Mixup/Cutout。音频：时间拉伸、Pitch shifting、动态范围压缩、加背景噪声。目的：扩样本、抗过拟合、提升泛化。注意：增强要与任务语义一致（如 OCR 不宜翻转文字）。",
   src:"某头部厂商真题 · 某头部厂商算法面经（“数据增强的方法”）"},
  {cat:"CV与NLP",q:"人脸识别的损失函数有哪些演进？（对比学习视角）",point:"度量学习（某头部厂商原题，面试官做人脸识别）",
   ans:"Softmax 交叉熵→改进判别性：Center Loss（类内紧凑）→Triplet Loss（锚点-正-负样本）→ArcFace/CosFace（角度间隔 margin，类间分离）。思路核心：拉近同类、推远异类。可扩展到通用表示学习（对比学习 SimCLR 等）。",
   src:"某头部厂商真题 · 某头部厂商算法面经（“人脸识别的损失函数”）"},
  {cat:"CV与NLP",q:"怎么区分照片和真人（活体检测）？",point:"CV 场景开放题（某头部厂商面试官追问）",
   ans:"单张图片难判断，可多帧利用运动信息（眨眼、头部姿态、微表情）。深度图/3D 结构（RGB-D 相机，照片是平面）。光照反射与阴影一致性分析。面试时先跟面试官确认输入形式（可多张照片），再给方案——沟通本身是加分项。",
   src:"某头部厂商真题 · 某头部厂商算法面经（大白智能整理，面试官提示可拍多张）"},
  {cat:"CV与NLP",q:"传统图像处理：Canny 算子的流程？",point:"图像处理基础（某头部厂商原题）",
   ans:"高斯滤波去噪；计算梯度幅值与方向（Sobel）；非极大值抑制（细化边缘）；双阈值检测与滞后连接（高阈值定强边缘，低阈值补弱边缘并连接）。",
   src:"某头部厂商真题 · 某头部厂商算法面经（“Canny 算子”）"},
  {cat:"CV与NLP",q:"两阶段（Faster R-CNN）和一阶段（YOLO）目标检测的区别？为什么两阶段精度高、一阶段快？",point:"目标检测主线",
   ans:"两阶段：RPN 提候选框→二次精修分类回归，正负样本更均衡、定位更精细。一阶段：网格直接回归，快但正负样本极度不平衡拉低精度。Focal Loss 缓解一阶段样本不平衡（易分样本压低权重）。演进：anchor-based→anchor-free（CenterNet/DETR）。",
   src:"其他大厂 · CV 岗高频"},
  {cat:"CV与NLP",q:"手撕 NMS（非极大值抑制）和 IoU 计算",point:"手撕代码（CV 岗高频）",
   ans:"IoU：交集面积/并集面积，注意无交集返回 0，坐标 [x1,y1,x2,y2]。NMS：按置信度排序→取最高框→删除与其 IoU>阈值的框→重复。边界条件（空列表、完全包含）。可扩展讲 Soft-NMS（衰减而非删除）。",
   src:"其他大厂 · CV 岗高频"},
  {cat:"CV与NLP",q:"Word2Vec 的 CBOW 和 Skip-gram 区别？负采样解决了什么？",point:"词向量",
   ans:"CBOW 用上下文预测中心词，适合小语料、快；Skip-gram 用中心词预测上下文，适合大语料、对罕见词更好。原始 softmax 词表巨大计算量爆炸；负采样用少量负样本（按词频 3/4 次方采样）做二分类近似，大幅加速。层次 softmax 是另一加速方案。",
   src:"其他大厂 · 腾讯/NLP 岗高频"},
  {cat:"CV与NLP",q:"BERT 怎么预训练的？MLM 的 15% mask 中 80/10/10 的原因？BERT 和 GPT 区别？",point:"预训练模型（NLP 必考）",
   ans:"两个任务：MLM（掩码词预测）+NSP（下一句预测）。15% 中被选 token：80% 换 [MASK]（让模型学预测）、10% 随机替换（缓解训练/推理 mask 不一致）、10% 保持不变（拉向真实表征）——防止模型只依赖 [MASK] 标记。BERT 是 encoder-only 双向，适合理解类任务（分类/抽取）；GPT 是 decoder-only 单向自回归，适合生成。",
   src:"其他大厂 · 腾讯/字节 NLP 岗高频"},
  {cat:"CV与NLP",q:"BERT 的输入由哪三个 embedding 组成？为什么要做 Segment/Position embedding？",point:"BERT 输入表示",

/* ================= Q&A 应用逻辑 ================= */
const CATS = ["全部","机器学习","深度学习","大模型","CV与NLP","数学基础","项目深挖","行为HR"];
let curCat = "全部", curMem = "all";
const memStore = (() => {
  try { const s = localStorage.getItem("aiQA_mem"); return s ? JSON.parse(s) : {}; } catch(e){ return {}; }
})();
function saveMem(){ try{ localStorage.setItem("aiQA_mem", JSON.stringify(memStore)); }catch(e){} }
function memOf(i){ return memStore[i] || "none"; }

function buildCatBar(){
  const bar = document.getElementById("catBar"); bar.innerHTML="";
  CATS.forEach(c=>{
    const d=document.createElement("div"); d.className="chip"+(c===curCat?" active":""); d.textContent=c;
    d.onclick=()=>{ curCat=c; document.querySelectorAll("#catBar .chip").forEach(x=>x.classList.remove("active")); d.classList.add("active"); renderQA(); };
    bar.appendChild(d);
  });
}
document.querySelectorAll("#memBar .chip").forEach(ch=>{
  ch.onclick=()=>{ curMem=ch.dataset.mem; document.querySelectorAll("#memBar .chip").forEach(x=>x.classList.remove("active")); ch.classList.add("active"); renderQA(); };
});

function renderQA(){
  const list=document.getElementById("qaList"); list.innerHTML="";
  const items = QA.map((q,i)=>({q,i})).filter(({q,i})=>{
    if(curCat!=="全部" && q.cat!==curCat) return false;
    if(curMem!=="all" && memOf(i)!==curMem) return false;
    return true;
  });
  // stats
  let yesN=0,noN=0,noneN=0; QA.forEach((_,i)=>{ const m=memOf(i); if(m==="yes")yesN++; else if(m==="no")noN++; else noneN++; });
  document.getElementById("qaStats").textContent = "共 "+QA.length+" 题 · 已记住 "+yesN+" · 未记住 "+noN+" · 未标记 "+noneN+"　|　当前显示 "+items.length+" 题";
  if(items.length===0){ list.innerHTML='<div class="empty">该筛选下暂无题目</div>'; return; }
  items.forEach(({q,i})=>{
    const m=memOf(i);
    const card=document.createElement("div"); card.className="qcard";
    card.innerHTML =
      '<div class="qhead">'
      + '<span class="chev">▶</span>'
      + '<div><span class="qcat">'+q.cat+'</span><span class="qtitle">'+q.q+'</span></div>'
      + '</div>'
      + '<div class="qbody">'
      + '<div class="row"><span class="lbl">考察点：</span>'+q.point+'</div>'
      + '<div class="row"><span class="lbl">参考思路：</span>'+q.ans+'</div>'
      + '<div class="row"><span class="lbl">来源：</span><span class="src">'+q.src+'</span></div>'
      + '<div class="marks">'
      + '<div class="mk yes'+(m==="yes"?" on":"")+'" data-i="'+i+'" data-m="yes">✅ 已记住</div>'
      + '<div class="mk no'+(m==="no"?" on":"")+'" data-i="'+i+'" data-m="no">🧡 未记住</div>'
      + '</div>'
      + '</div>';
    card.querySelector(".qhead").onclick=()=>{ card.classList.toggle("open"); };
    card.querySelectorAll(".mk").forEach(b=>{
      b.onclick=(e)=>{ e.stopPropagation(); setMark(+b.dataset.i, b.dataset.m); };
    });
    list.appendChild(card);
  });
}
function setMark(i,m){
  const cur=memOf(i);
  if(cur===m){ delete memStore[i]; }   // 再点一次取消
  else { memStore[i]=m; }
  saveMem(); renderQA();
}

/* ================= 模式切换 ================= */
function showPanel(name){
  const quiz=document.getElementById("quiz"), qa=document.getElementById("qa");
  const tq=document.getElementById("tabQuiz"), tqa=document.getElementById("tabQA");
  if(name==="qa"){ quiz.style.display="none"; qa.style.display="block"; tq.classList.remove("active"); tqa.classList.add("active"); renderQA(); }
  else { qa.style.display="none"; quiz.style.display="block"; tqa.classList.add("active"); tq.classList.remove("active"); }
}
document.getElementById("tabQuiz").onclick=()=>showPanel("quiz");
document.getElementById("tabQA").onclick=()=>showPanel("qa");
